  const [refused, setRefused] = useState(false);
  return (
    <div style={{...sans, minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'24px 24px 80px', background:I.bg, color:I.ink, textAlign:'center'}}>
      <div style={capsIv(11, I.gold, {letterSpacing:'.34em', fontWeight:600, marginBottom:14})}>Cave &amp; Sélection</div>
      <div style={{...serif, fontSize:'clamp(3rem,10vw,4.4rem)', fontWeight:500, color:I.wine, lineHeight:.95, letterSpacing:'-.02em'}}>WineSelect</div>
      <div style={{display:'flex', alignItems:'center', justifyContent:'center', gap:12, margin:'22px auto 40px'}}>
        <span style={{width:56, height:1, background:I.bord2}}/>
        <span style={{width:6, height:6, transform:'rotate(45deg)', background:I.gold}}/>
        <span style={{width:56, height:1, background:I.bord2}}/>
      </div>
      <div style={{maxWidth:440, width:'100%', background:I.cream, border:'1px solid ' + I.bord, borderRadius:24, padding:'34px 28px'}}>
        {refused ? (
          <div>
            <div style={{...serif, fontSize:28, fontWeight:500, color:I.wine, marginBottom:10}}>Accès réservé aux adultes</div>
            <p style={{fontSize:15, color:I.body, lineHeight:1.7, margin:'0 0 24px'}}>La vente d'alcool est interdite aux mineurs. Cette borne n'est pas accessible aux moins de 18 ans.</p>
            <button onClick={()=>setRefused(false)} style={{...sans, minHeight:52, padding:'0 28px', background:'transparent', color:I.wine, border:'1px solid ' + I.bord2, borderRadius:999, cursor:'pointer', fontSize:14}}>Retour</button>
          </div>
        ) : (
          <div>
            <div style={{...serif, fontSize:30, fontWeight:500, color:I.wine, marginBottom:10, lineHeight:1.15}}>Avez-vous 18 ans ou plus ?</div>
            <p style={{fontSize:15, color:I.body, lineHeight:1.7, margin:'0 0 26px'}}>Cet espace présente des boissons alcoolisées. La vente d'alcool est interdite aux mineurs.</p>
            <div style={{display:'flex', gap:10}}>
              <button onClick={onConfirm} style={{...sans, flex:1.6, minHeight:58, background:I.wine, color:I.bg, border:'none', borderRadius:999, cursor:'pointer', fontSize:15, fontWeight:500}}>Oui, j'ai 18 ans ou plus</button>
              <button onClick={()=>setRefused(true)} style={{...sans, flex:1, minHeight:58, background:'transparent', color:I.wine, border:'1px solid ' + I.bord2, borderRadius:999, cursor:'pointer', fontSize:15}}>Non</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── NOTATION (étoiles) ────────────────────────────────────────────────────────
function WineRating({wineId, value=0, onRate, size=17}) {
  const [hover, setHover] = useState(0);
  return (
    <div style={{display:'flex',gap:Math.round(size/5),justifyContent:'center'}} onMouseLeave={()=>setHover(0)}>
      {[1,2,3,4,5].map(s=>(
        <span key={s} role="button" aria-label={s + ' sur 5'}
          onClick={e=>{e.stopPropagation(); onRate(wineId, s);}}
          onMouseEnter={()=>setHover(s)}
          style={{fontSize:size, cursor:'pointer', lineHeight:1, padding:'2px', color:(hover||value)>=s?C_IVOIRE.wine:C_IVOIRE.bord2, transition:'color .2s', userSelect:'none'}}>★</span>
      ))}
    </div>
  );
}

// ── LOGIN CARTE CLIENT ────────────────────────────────────────────────────────
function LoginScreen({setView, customerApi}) {
  const I = C_IVOIRE;
  const sans = {fontFamily:'Montserrat,sans-serif'};
  const [card,    setCard]    = useState('');
  const [welcome, setWelcome] = useState(null);
  const inputRef = useRef(null);
  useEffect(()=>{ inputRef.current && inputRef.current.focus(); },[]);

  const submit = () => {
    const res = customerApi.login(card);
    if (!res) return;
    setCard('');
    setWelcome(res);
    setTimeout(()=>setView('home'), 1400);
  };

  const cust = customerApi.customer;
  const carte = {background:I.cream, border:'1px solid ' + I.bord, borderRadius:24, padding:'32px 26px'};
  const boutonPlein = {...sans, minHeight:52, padding:'0 26px', background:I.wine, color:I.bg, border:'none', borderRadius:999, cursor:'pointer', fontSize:14, fontWeight:500};
  const boutonTrait = {...sans, minHeight:52, padding:'0 26px', background:'transparent', color:I.wine, border:'1px solid ' + I.bord2, borderRadius:999, cursor:'pointer', fontSize:14};
  const Rond = ({children}) => <div style={{width:72, height:72, margin:'0 auto 18px', borderRadius:'50%', border:'1px solid ' + I.bord2, display:'flex', alignItems:'center', justifyContent:'center', color:I.wine}}>{children}</div>;

  return (
    <div style={{...sans, minHeight:'100vh', background:I.bg, color:I.ink}}>
      <Header title="Carte client" subtitle="Programme fidélité du magasin" onBack={()=>setView('home')}/>
      <div style={{maxWidth:480, margin:'0 auto', padding:'36px 20px 120px', textAlign:'center'}}>
        {welcome ? (
          <div style={carte}>
            <Rond><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></Rond>
            <div style={{...serif, fontSize:30, fontWeight:500, color:I.wine, marginBottom:8}}>{welcome.isNew ? 'Bienvenue' : 'Bon retour, ' + welcome.profile.name}</div>
            <p style={{fontSize:15, color:I.body, lineHeight:1.7, margin:0}}>{welcome.isNew ? 'Votre profil client vient d\'être créé. Votre cave et vos notes seront désormais liées à votre carte.' : 'Votre cave et vos préférences sont chargées. Le sommelier tient compte de vos goûts.'}</p>
          </div>
        ) : cust ? (
          <div style={carte}>
            <Rond><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg></Rond>
            <div style={{...serif, fontSize:30, fontWeight:500, color:I.wine, marginBottom:4}}>{cust.name}</div>
            <div style={{fontSize:13, color:I.muted, marginBottom:24}}>{'Carte n° ' + cust.id + ' · client depuis le ' + new Date(cust.createdAt).toLocaleDateString('fr-FR')}</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:26}}>
              {[['Vins dans ma cave', Object.keys(cust.collection||{}).length], ['Vins notés', Object.keys(cust.ratings||{}).length]].map(([l,v])=>(
                <div key={l} style={{background:I.bg, border:'1px solid ' + I.bord, borderRadius:16, padding:'18px 10px'}}>
                  <div style={{...serif, fontSize:34, fontWeight:500, color:I.wine, lineHeight:1}}>{v}</div>
                  <div style={capsIv(10, I.muted, {letterSpacing:'.14em', marginTop:8})}>{l}</div>
                </div>
              ))}
            </div>
            <div style={{display:'flex', gap:10, justifyContent:'center', flexWrap:'wrap'}}>
              <button onClick={()=>setView('collector')} style={boutonPlein}>Ma cave</button>
              <button onClick={()=>{customerApi.logout();}} style={boutonTrait}>Déconnexion</button>
            </div>

          </div>
        ) : (
          <div>
            <Rond><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg></Rond>
            <div style={{...serif, fontSize:34, fontWeight:500, color:I.wine, marginBottom:10, lineHeight:1.1}}>Scannez votre carte</div>
            <p style={{fontSize:15, color:I.body, lineHeight:1.7, margin:'0 0 26px'}}>Passez votre carte client sous le lecteur de la borne, ou saisissez son numéro.</p>
            <div style={carte}>
              <input ref={inputRef} value={card} onChange={e=>setCard(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}
                placeholder="N° de carte client" inputMode="numeric"
                style={{...sans, width:'100%', minHeight:58, background:I.bg, border:'1px solid ' + I.bord2, color:I.ink, borderRadius:999, padding:'0 20px', fontSize:18, outline:'none', textAlign:'center', letterSpacing:'.1em', marginBottom:14}}/>
              <button onClick={submit} disabled={!card.trim()} style={{...boutonPlein, width:'100%', minHeight:56, background:card.trim() ? I.wine : I.bord, cursor:card.trim() ? 'pointer' : 'default', fontSize:15}}>Se connecter</button>
              <div style={{fontSize:12, color:I.muted, marginTop:14, lineHeight:1.6}}>Le lecteur remplit ce champ et valide tout seul.</div>
            </div>
            <div style={{background:I.soft, borderRadius:16, padding:'16px 18px', fontSize:12.5, color:I.body, lineHeight:1.7, textAlign:'left', marginTop:16}}>
              <div style={capsIv(10, I.wine, {letterSpacing:'.18em', fontWeight:600, marginBottom:6})}>Vos données</div>
              En vous connectant, votre numéro de carte, votre cave et vos notes sont enregistrés sur cette borne, uniquement pour personnaliser vos recommandations. Aucune donnée nominative n'est transmise à des tiers : seules vos préférences gustatives, anonymes, sont utilisées par le sommelier. Vous pouvez supprimer votre profil à tout moment depuis cet écran, ou en faire la demande à l'accueil du magasin.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── DÉPANNAGE (installateur, technicien) ──────────────────────────────────────
// Ouvert par un appui long sur le logo de l'accueil, puis un code : le code
// commun des bornes (espace super admin) en mode connecté, le PIN de la borne
// en mode autonome. Jamais destiné aux clients ; la remise à zéro après 90 s
// d'inactivité le referme comme n'importe quel écran.

// Appui long : déclenche fn après ms millisecondes de pression continue (doigt ou souris).
let minuterieAppuiLong = null;
function appuiLong(fn, ms) {
  const annuler = () => { if (minuterieAppuiLong) { clearTimeout(minuterieAppuiLong); minuterieAppuiLong = null; } };
  return {
    onPointerDown: () => { annuler(); minuterieAppuiLong = setTimeout(() => { minuterieAppuiLong = null; fn(); }, ms || 3000); },
    onPointerUp: annuler, onPointerLeave: annuler, onPointerCancel: annuler,
    onContextMenu: e => e.preventDefault(),
  };
}

function Depannage({setView}) {
  const I = C_IVOIRE;
  const sans = {fontFamily:'Montserrat,sans-serif'};
  const [code, setCode] = useState('');
  const [jeton, setJeton] = useState(null);
  const [etat, setEtat] = useState(null);
  const [erreur, setErreur] = useState('');
  const [info, setInfo] = useState('');
  const [occupe, setOccupe] = useState(false);
  const [test, setTest] = useState(null);
  const [install, setInstall] = useState({serveur:'', jeton:''});
  const [installe, setInstalle] = useState(false);

  const appel = async (chemin, corps, methode) => {
    const r = await fetch('/api/depannage/' + chemin, {
      method: methode || (corps ? 'POST' : 'GET'),
      headers: Object.assign({'Content-Type':'application/json'}, jeton ? {'X-Admin-Token': jeton} : {}),
      body: corps ? JSON.stringify(corps) : undefined,
    });
    let d = {};
    try { d = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(d.error || ('Erreur ' + r.status));
    return d;
  };
  const action = async (fn) => {
    setOccupe(true); setErreur(''); setInfo('');
    try { await fn(); } catch (e) { setErreur(e.message); } finally { setOccupe(false); }
  };

  const ouvrir = () => action(async () => {
    const d = await appel('ouvrir', {code: code});
    setJeton(d.token); setEtat(d.etat); setCode('');
    setInstall({serveur: d.etat.serveur || 'https://gestion.wineselect-france.fr', jeton: ''});
  });
  const touche = t => {
    setErreur('');
    if (t === 'effacer') setCode(code.slice(0, -1));
    else if (t === 'ok') ouvrir();
    else if (code.length < 10) setCode(code + t);
  };

  const bouton = (libelle, onClick, plein, desactive) => (
    <button onClick={onClick} disabled={occupe || desactive} style={{...sans, minHeight:50, padding:'0 22px', borderRadius:999, fontSize:14, fontWeight:500,
      cursor: occupe ? 'wait' : 'pointer', opacity: (occupe || desactive) ? .6 : 1,
      background: plein ? I.wine : 'transparent', color: plein ? I.bg : I.wine, border:'1px solid ' + (plein ? I.wine : I.bord2)}}>{libelle}</button>
  );
  const ligne = (libelle, valeur, alerte) => (
    <div style={{display:'flex', justifyContent:'space-between', gap:16, padding:'9px 0', borderBottom:'1px solid ' + I.bord, fontSize:14}}>
      <span style={{color:I.muted}}>{libelle}</span>
      <span style={{color: alerte ? '#9b2c2c' : I.ink, textAlign:'right', fontWeight:500}}>{valeur}</span>
    </div>
  );
  const cadre = {background:I.cream, border:'1px solid ' + I.bord, borderRadius:20, padding:'20px 22px', marginBottom:16};
  const titre = t => <div style={capsIv(11, I.gold, {fontWeight:600, marginBottom:12})}>{t}</div>;
  const message = (texte, mauvais) => texte ? <div style={{fontSize:14, lineHeight:1.5, padding:'12px 16px', borderRadius:14, marginBottom:16,
    color: mauvais ? '#9b2c2c' : '#2f5f33', background: mauvais ? '#fbeef0' : '#eef5ee', border:'1px solid ' + (mauvais ? '#ecc8ce' : '#cfe3cf')}}>{texte}</div> : null;
  const dateHeure = iso => iso ? new Date(iso).toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : 'jamais';

  return (
    <div style={{minHeight:'100vh', background:I.bg, color:I.ink, ...sans}}>
      <EnteteIvoire onBack={() => setView('home')}/>
      <div style={{maxWidth:560, margin:'0 auto', padding:'28px 24px 120px'}}>
        <div style={capsIv(11, I.gold, {fontWeight:600, marginBottom:8})}>Réservé à l'installation</div>
        <h2 style={{...serif, fontSize:38, fontWeight:500, color:I.wine, margin:'0 0 22px'}}>Dépannage de la borne</h2>

        {!jeton ? (
          <div style={cadre}>
            <div style={{fontSize:14, color:I.body, marginBottom:16, lineHeight:1.6}}>Saisissez le code de dépannage.</div>
            <div style={{textAlign:'center', fontSize:30, letterSpacing:'.4em', minHeight:44, color:I.wine, marginBottom:12}}>{code ? '•'.repeat(code.length) : '—'}</div>
            {message(erreur, true)}
            <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:10}}>
              {['1','2','3','4','5','6','7','8','9','effacer','0','ok'].map(t => (
                <button key={t} onClick={() => touche(t)} disabled={occupe}
                  style={{...sans, minHeight:62, borderRadius:16, fontSize: t.length > 1 ? 14 : 24, cursor:'pointer',
                    background: t === 'ok' ? I.wine : I.bg, color: t === 'ok' ? I.bg : I.ink, border:'1px solid ' + (t === 'ok' ? I.wine : I.bord2)}}>
                  {t === 'effacer' ? 'Effacer' : t === 'ok' ? (occupe ? '…' : 'Valider') : t}
                </button>
              ))}
            </div>
          </div>
        ) : (
          <div>
            {message(erreur, true)}
            {message(info, false)}
            <div style={cadre}>
              {titre('État')}
              {ligne('Mode', etat.mode === 'connecte' ? 'Connectée au serveur WineSelect' : 'Autonome (démonstration)')}
              {etat.magasin && ligne('Magasin', etat.magasin)}
              {etat.serveur && ligne('Serveur', etat.serveur)}
              {etat.jeton && ligne('Jeton', etat.jeton)}
              {ligne('Catalogue', etat.catalogue.vins + ' vins' + (etat.catalogue.version ? ' · version ' + etat.catalogue.version : ''), !etat.catalogue.vins)}
              {etat.synchro && ligne('Serveur joignable', etat.synchro.joignable ? 'oui' : (etat.synchro.joignable === false ? 'non' : 'pas encore vérifié'), etat.synchro.joignable === false)}
              {etat.synchro && ligne('Dernière synchronisation', dateHeure(etat.synchro.derniere))}
              {etat.synchro && etat.synchro.erreur && ligne('Dernière erreur', etat.synchro.erreur, true)}
              {ligne('Sommelier', etat.sommelier)}
              {etat.mode === 'connecte' && !etat.codeDepannageDefini && ligne('Code de dépannage', 'non défini', true)}
              {ligne('Version de la borne', etat.versionBorne)}
              <div style={{display:'flex', gap:10, flexWrap:'wrap', marginTop:16}}>
                {etat.mode === 'connecte' && bouton('Synchroniser maintenant', () => action(async () => { setEtat(await appel('synchroniser', {})); setInfo('Synchronisation terminée.'); }), true)}
                {bouton('Tester le sommelier', () => action(async () => { setTest(null); setTest(await appel('tester', {})); }), etat.mode !== 'connecte')}
              </div>
            </div>

            {test && (
              <div style={cadre}>
                {titre('Test du sommelier')}
                <div style={{fontSize:14, color:I.body, lineHeight:1.7}}>
                  <div>{test.demande + ' · réponse en ' + (test.duree / 1000).toFixed(1).replace('.', ',') + ' s'}</div>
                  <div>{'Source : ' + test.source}</div>
                  {(test.vins || []).map((v, i) => <div key={i} style={{color:I.ink, fontWeight:500}}>{(i + 1) + '. ' + v}</div>)}
                  {!test.ok && <div style={{color:'#9b2c2c'}}>{test.error || 'Le sommelier n\'a pas proposé 3 vins.'}</div>}
                </div>
              </div>
            )}

            <div style={cadre}>
              {titre(etat.mode === 'connecte' ? 'Changer de jeton' : 'Installer la borne')}
              <div style={{fontSize:14, color:I.body, lineHeight:1.6, marginBottom:14}}>Jeton créé dans l'espace super admin (fiche du magasin, « Ajouter une borne »). Il commence par « wsb_ ».</div>
              <label style={{display:'block', fontSize:13, color:I.body, marginBottom:6}}>Adresse du serveur</label>
              <input value={install.serveur} onChange={e => setInstall(Object.assign({}, install, {serveur: e.target.value}))}
                style={{...sans, width:'100%', minHeight:50, padding:'0 16px', fontSize:15, borderRadius:14, border:'1px solid ' + I.bord2, background:I.bg, color:I.ink, marginBottom:14, boxSizing:'border-box'}}/>
              <label style={{display:'block', fontSize:13, color:I.body, marginBottom:6}}>Jeton de la borne</label>
              <textarea value={install.jeton} onChange={e => setInstall(Object.assign({}, install, {jeton: e.target.value.replace(/\s/g, '')}))} rows={3}
                style={{...sans, width:'100%', padding:'12px 16px', fontSize:14, borderRadius:14, border:'1px solid ' + I.bord2, background:I.bg, color:I.ink, marginBottom:14, boxSizing:'border-box', fontFamily:'monospace', wordBreak:'break-all'}}/>
              {installe
                ? bouton('Recharger l\'écran avec le catalogue du magasin', () => window.location.reload(), true)
                : bouton(etat.mode === 'connecte' ? 'Enregistrer le nouveau jeton' : 'Installer', () => action(async () => {
                  const e = await appel('installer', {serveur: install.serveur, jeton: install.jeton});
                  setEtat(e); setInstalle(true); setInstall(Object.assign({}, install, {jeton: ''}));
                  setInfo('Borne installée pour « ' + (e.magasin || 'le magasin') + ' » (' + e.catalogue.vins + ' vins). Rechargez l\'écran.');
                }), true, !install.jeton)}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [view,    setView]    = useState('home');
  const [results, setResults] = useState([]);
  const customerApi = useCustomer();
  const collector = useCollector(customerApi);

  // ── Réinitialisation automatique entre deux clients ──────────────────────
  // Après un temps d'inactivité (aucun clic/toucher/touche), on déconnecte
  // le client en cours et on revient à l'accueil, pour ne jamais laisser le
  // profil d'un client visible pour le suivant.
  const IDLE_TIMEOUT_MS = 90 * 1000; // 90 secondes — ajustable ici
  const idleTimerRef = useRef(null);
  const veilleRef = useRef(null);

  // Mode connecté : si le catalogue a changé sur le serveur central, l'écran se
  // recharge, mais seulement entre deux clients (borne inactive), jamais pendant
  // une recherche. Vérifié à chaque remise à zéro (elle se répète toutes les
  // 90 s tant que personne ne touche la borne), et au plus tard toutes les 5 minutes.
  const verifierCatalogue = useCallback(() => {
    if (!window.WS_MODE_CONNECTE) return;
    fetch('/version').then(r => r.json()).then(v => {
      if (v && v.versionCatalogue && v.versionCatalogue !== window.WS_VERSION_CATALOGUE) window.location.reload();
    }).catch(() => {});
  }, []);

  const resetForNextCustomer = useCallback(() => {
    customerApi.logout();
    setResults([]);
    setView('home');
    // Chaque nouveau client doit reconfirmer sa majorité — on ne réutilise
    // jamais la confirmation d'âge d'un client précédent.
    try{ sessionStorage.removeItem('ws_age_ok'); }catch(e){}
    setAgeOk(false);
    verifierCatalogue();
    if (window.WS_MODE_CONNECTE && !veilleRef.current) veilleRef.current = setInterval(verifierCatalogue, 5 * 60 * 1000);
  }, [customerApi, verifierCatalogue]);

  useEffect(() => {
    const scheduleReset = () => {
      // Un client touche la borne : plus de vérification en veille.
      if (veilleRef.current) { clearInterval(veilleRef.current); veilleRef.current = null; }
      if (idleTimerRef.current) clearTimeout(idleTimerRef.current);
      idleTimerRef.current = setTimeout(resetForNextCustomer, IDLE_TIMEOUT_MS);
    };
    const events = ['touchstart', 'mousedown', 'keydown'];
    events.forEach(ev => window.addEventListener(ev, scheduleReset));
    scheduleReset();
    return () => {
      events.forEach(ev => window.removeEventListener(ev, scheduleReset));
      if (idleTimerRef.current) clearTimeout(idleTimerRef.current);
    };
  }, [resetForNextCustomer]);

  // Vérification de majorité — redémandée à chaque nouvelle session de la borne
  const [ageOk, setAgeOk] = useState(()=>{ try{ return sessionStorage.getItem('ws_age_ok')==='1'; }catch(e){ return false; } });
  if (!ageOk) {
    return (
      <div style={{maxWidth:680, margin:'0 auto', fontFamily:'Montserrat,sans-serif'}}>
        <AgeGate onConfirm={()=>{ try{ sessionStorage.setItem('ws_age_ok','1'); }catch(e){} setAgeOk(true); }}/>
        <SanteBanner/>
      </div>
    );
  }
  return (
    <div style={{maxWidth:680, margin:'0 auto', fontFamily:'Montserrat,sans-serif'}}>
      <style>{'@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}*{box-sizing:border-box}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(212,175,55,.35);border-radius:2px}'}</style>
      {view==='home'      && <Home          setView={setView} collector={collector} customerApi={customerApi}/>}
      {view==='login'     && <LoginScreen   setView={setView} customerApi={customerApi}/>}
      {view==='selection' && <Selection     setView={setView} setResults={setResults}/>}
      {view==='results'   && <Results       setView={setView} results={results} collector={collector}/>}
      {view==='mystery'   && <Mystery       setView={setView} collector={collector}/>}
      {view==='chat'      && <Chat          setView={setView} collector={collector} customer={customerApi.customer}/>}
      {view==='collector' && <CollectorPage setView={setView} collector={collector} customer={customerApi.customer}/>}
      {view==='depannage' && <Depannage setView={setView}/>}
      {view!=='home' && view!=='depannage' && (
        <button
          onClick={()=>{ customerApi.logout(); setResults([]); setView('home'); try{ sessionStorage.removeItem('ws_age_ok'); }catch(e){} setAgeOk(false); }}
          style={{position:'fixed', ...(view==='chat' ? {top:22} : {bottom:56}), right:'max(20px, calc(50% - 316px))', zIndex:50, minHeight:46, background:view==='chat' ? '#ffffff' : C.wine, color:view==='chat' ? C.wine : '#faf6ee', border:'1px solid ' + C.wine, borderRadius:999, padding:'0 22px', fontSize:13, fontWeight:500, letterSpacing:'.03em', cursor:'pointer', boxShadow:view==='chat' ? 'none' : '0 12px 30px rgba(94,22,34,.22)', fontFamily:'Montserrat,sans-serif'}}
        >J'ai terminé</button>
      )}
      <div style={{height:34}}/>
      <SanteBanner/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
