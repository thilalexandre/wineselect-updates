<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const WINES = window.WINES_DATA;
// Version allégée du catalogue pour le sommelier : reconstruite depuis WINES si le fichier
// du catalogue ne la fournit pas (sinon l'application ne démarre pas).
// Catalogue envoyé au sommelier : champs objectifs seulement (une ancienne note /100 du
// catalogue du magasin n'est jamais transmise)
const CATALOG = (window.CATALOG_DATA || WINES || []).map(w => ({id:w.id, name:w.name, type:w.type, price:w.price, region:w.region, grape:w.grape, pairings:w.pairings}));
// Fiche produit enrichie (facultative) : domaine, cuvée, millésime, photo de la
// bouteille et emplacement en rayon. Viennent de wines-data.js ou de l'import
// CSV de l'admin. Si un champ manque, l'affichage retombe sur l'existant.
const CHAMPS_FICHE = ['domaine','cuvee','millesime','photo','emplacement'];
// Application des stocks/prix importés via CSV (admin)
// Mode connecté : le catalogue reçu du serveur central est déjà à jour ; une
// ancienne copie gardée dans le navigateur ne doit jamais l'écraser.
try {
  const ov = window.WS_MODE_CONNECTE ? [] : JSON.parse(localStorage.getItem('ws_stock_overrides')||'[]');
  ov.forEach(o=>{ const w=WINES.find(x=>x.id===o.id); if(w){
    if(typeof o.stock==='number'&&!isNaN(o.stock)) w.stock=o.stock;
    if(typeof o.price==='number'&&!isNaN(o.price)) w.price=o.price;
    if(typeof o.featured==='boolean') w.featured=o.featured;
    if(typeof o.featuredReason==='string') w.featuredReason=o.featuredReason;
    CHAMPS_FICHE.forEach(k=>{ if(o[k]!==undefined && o[k]!==null && String(o[k]).trim()) w[k]=String(o[k]).trim(); });
  } });
} catch(e) {}
// Cohérence budget/prix : la tranche affichée découle TOUJOURS du prix réel,
// pour que la sélection guidée ne propose jamais un vin hors du budget choisi.
const budgetForPrice = p => p<=8 ? '-8' : p<=15 ? '8-15' : p<=25 ? '15-25' : p<=50 ? '25-50' : '50+';
WINES.forEach(w=>{ w.budget = budgetForPrice(w.price); });

// ── Fiche produit : nom affiché, ligne de détails, photo, emplacement ────────
// RÈGLE UNIQUE D'IDENTITÉ D'UN VIN (comme sur une étiquette) :
//   titre    = la cuvée si elle existe, sinon le producteur (Château, Domaine,
//              Maison...), sinon le nom du catalogue ;
//   surtitre = le producteur, seulement quand il y a une cuvée ;
//   détails  = appellation · millésime · région · cépage.
// Le libellé complet (libelleVin) est le nom que le sommelier écrit dans le chat.
// ⚠️ libelleVin existe en double dans serveur.js : les deux doivent rester identiques.
const nomVin = w => !w ? '' : w.cuvee ? String(w.cuvee) : w.domaine ? String(w.domaine) : w.name;
const surtitreVin = w => (w && w.cuvee && w.domaine) ? String(w.domaine) : '';
const detailsVin = w => [(w.cuvee || w.domaine) ? w.appellation : null, w.millesime, w.region, w.grape].filter(Boolean).join(' · ');
function libelleVin(w) {
  if (!w) return '';
  if (!w.domaine && !w.cuvee) return w.millesime ? w.name + ' ' + w.millesime : w.name;
  let s = w.domaine && w.cuvee ? w.domaine + ' — ' + w.cuvee : (w.cuvee || w.domaine);
  if (w.appellation && s.toLowerCase().indexOf(String(w.appellation).toLowerCase()) < 0) s += ', ' + w.appellation;
  if (w.millesime) s += ' ' + w.millesime;
  return s;
}
// Le catalogue envoyé au sommelier porte le libellé complet : il nomme donc
// les vins exactement comme l'écran les affiche.
CATALOG.forEach(c => { const w = WINES.find(x => x.id === c.id); if (w) c.name = libelleVin(w); });

// Photo de la bouteille si elle existe (chemin du type photos/123.jpg, relatif au
// dossier de la borne, ou adresse web). Sinon, ou si l'image ne charge pas,
// l'illustration dessinée habituelle.
function PhotoVin({wine, h}) {
  const [erreur, setErreur] = useState(false);
  if (wine.photo && !erreur) {
    return <img src={wine.photo} alt={'Bouteille ' + nomVin(wine)} onError={()=>setErreur(true)}
      style={{height:h, maxWidth:'100%', objectFit:'contain', display:'block'}}/>;
  }
  return <Bottle wine={wine} h={h} label={false}/>;
}

// Emplacement en rayon (ex. « Allée 12 · Étagère 3 »), affiché seulement s'il est renseigné.
function EmplacementVin({wine, grand}) {
  if (!wine.emplacement) return null;
  return (
    <div style={{display:'inline-flex', alignItems:'center', gap:8, alignSelf:'flex-start', padding:grand?'9px 14px':'6px 11px', background:'#f3ece0', borderRadius:10, color:'#2a1215', fontSize:grand?14:12, fontWeight:500, lineHeight:1.3}}>
      <svg width={grand?18:15} height={grand?18:15} viewBox="0 0 24 24" fill="none" stroke="#5e1622" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>{'En rayon : ' + wine.emplacement}</span>
    </div>
  );
}

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          Retour

      <div style={{...serif, fontSize:22, fontWeight:600, color:I.wine, letterSpacing:'.02em'}}>WineSelect</div>
      <div style={{minWidth:96, display:'flex', justifyContent:'flex-end'}}>{droite || null}</div>
    </div>
  );
}

function TypeIcon({id, color, size=32}){
  const c=color||'#6B2635';

      <path d="M14 4h12l-1 12c-0.3 4-2.2 6.5-5 7.5V28h4v3H16v-3h4v-4.5c-2.8-1-4.7-3.5-5-7.5L14 4z" {...stem}/>
      <path d="M15.2 9h9.6" stroke={c} strokeWidth="1.6"/>
    </svg>;
  }
  if(id==='rosé'){
    return <svg width={size} height={size} viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 4h12l-1.2 12.5c-0.4 3.6-1.9 6.2-4.8 7.2v4.3h4v3H16v-3h4v-4.3c-2.9-1-4.4-3.6-4.8-7.2L14 4z" {...stem}/>
      <path d="M15.2 9h9.6" stroke={c} strokeWidth="1.6"/>
    </svg>;
  }
  if(id==='bulles'){
    return <svg width={size} height={size} viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M17 3c1.2 1.6 1.6 2.8 1.6 4.2 0 1-.5 1.6-1.1 2.3-.7.8-1.1 1.4-1.1 2.5 0 1.6 1.1 2.6 2.6 2.6s2.6-1 2.6-2.6" stroke={c} strokeWidth="1.5" strokeLinecap="round" fill="none"/>
      <path d="M13 15h14c.6 5-1 9-3.5 11v8h-7v-8C14 24 12.4 20 13 15z" {...stem}/>
      <circle cx="17.5" cy="19" r="0.9" fill={c}/>
      <circle cx="21.5" cy="21" r="0.9" fill={c}/>
      <circle cx="19" cy="23.5" r="0.9" fill={c}/>
    </svg>;
  }
  return null;
}

    case 'poisson':
      return <svg width={size} height={size} viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M4 16c4-5 10-7 15-5 3 1.2 6 3.5 9 5-3 1.5-6 3.8-9 5-5 2-11 0-15-5z" {...s}/><circle cx="21" cy="14" r="0.8" {...dot}/><path d="M4 16c1.5 1.5 2.5 3 2.5 5M4 16c1.5-1.5 2.5-3 2.5-5" {...s}/></svg>;
    case 'fruits de mer':

    case 'dessert':

    case 'asiatique':

    case 'barbecue':
      return <svg width={size} height={size} viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 4c1 4-3 5-3 9 0 2 1.5 3.5 3.5 3.5S20 17 20 15c2 2 3 4 3 6.5 0 4-3 7-7 7s-7-3-7-7c0-6 5-8 7-17.5z" {...s}/></svg>;
    default: return null;
  }
}

function shapeFor(wine){
  if (wine.type === 'bulles') return 'champagne';
  const t = ((wine.region||'')+' '+(wine.appellation||'')+' '+(wine.name||'')).toLowerCase();
  let s = 'bordeaux';
  if (/alsace|savoie|allemagne|riesling|gew[uü]rz|sylvaner|pinot gris|moselle/.test(t)) s = 'flute';
  else if (/provence|corse/.test(t)) s = (wine.type === 'rosé') ? 'provence' : 'burgundy';
  else if (/bourgogne|beaujolais|rh[ôo]ne|jura|bugey|chablis|m[âa]con|mercurey|givry|loire|auvergne|sancerre|pouilly|vouvray|muscadet|anjou|saumur|chinon|touraine|quincy|menetou|ch[âa]teauneuf|gigondas|vacqueyras|cairanne|rasteau|crozes|hermitage|c[ôo]te[- ]r[ôo]tie|cornas|saint-joseph|condrieu|ventoux|luberon|tavel|lirac|morgon|fleurie|brouilly|juli[ée]nas|chiroubles|moulin-[àa]-vent/.test(t)) s = 'burgundy';
  if (wine.type === 'rosé' && s === 'bordeaux') s = 'provence';
  return s;
}

// Profils gustatifs (corps, tanins, fraîcheur...) calculés par le serveur, pour le repli
// local de la sélection guidée. Vide si le serveur ne répond pas : le repli trie alors par prix.
let PROFILS_VINS = {};
fetch('http://localhost:3000/profils-vins').then(r => r.json()).then(p => { PROFILS_VINS = p || {}; }).catch(() => {});
// Goût choisi → corps visé (1 léger, 2 rond, 3 ample)
const GOUT_CORPS = {
  leger_frais:1, rouge_leger:1, blanc_vif:1, rose_pale:1, bulles_vives:1,
  fruite_gourmand:2, rouge_rond:2, blanc_aromatique:2, rose_fruite:2, bulles_fruitees:2,
  riche_intense:3, rouge_puissant:3, blanc_beurre:3, rose_vineux:3, bulles_vineuses:3,
};
const GOUTS_SUCRES = ['doux', 'blanc_moelleux', 'rose_tendre', 'bulles_douces'];
function noteGoutLocale(w, gout) {
  const p = PROFILS_VINS[w.id];
  if (!p) return -50;
  if (GOUTS_SUCRES.includes(gout)) return p.sucrosite * 10;
  const cible = GOUT_CORPS[gout] || 2;
  let s = -Math.abs(p.corps - cible) * 10 - p.sucrosite * 5;
  if (cible === 1) s += (p.fraicheur === 3 ? 5 : 0) - (p.tanins >= 2 ? 10 : 0) - (p.boise >= 2 ? 5 : 0);
  return s;
}

function filterWines(type, budget, pairing) {
  let results = WINES.filter(w =>
    (!type    || w.type === type) &&
    (!budget  || w.budget === budget) &&
    (!pairing || (w.pairings||[]).includes(pairing))
  );

  if (budget === '50+') {
    // Tranche sans plafond : 3 paliers progressifs (accessible ~60€ /
    // milieu ~80€ / haut de gamme ~130€) pour ne jamais proposer d'entrée
    // un grand cru très cher a un client qui a juste dit "plus de 50€".
    const tiers = [
      { max: 70, target: 60 },
      { max: 100, target: 80 },
      { max: Infinity, target: 130 },
    ];
    const rankOf = price => tiers.findIndex(t => price <= t.max);
    const used = new Set();
    const ladder = [];
    tiers.forEach((t, i) => {
      const pool = results.filter(w => rankOf(w.price) === i && !used.has(w.id));
      pool.sort((a, b) => {
        const da = Math.abs(a.price - t.target), db = Math.abs(b.price - t.target);
        return da - db;
      });
      if (pool.length) { ladder.push(pool[0]); used.add(pool[0].id); }
    });
    const rest = results.filter(w => !used.has(w.id))
      .sort((a, b) => a.price - b.price);
    results = [...ladder, ...rest];
  } else {
    // Haut de la fourchette d'abord (règle budget)
    results.sort((a, b) => b.price - a.price);
  }

  return results;
}

// Sauvegarde de secours vers le serveur : best-effort, jamais bloquant.
// Si le serveur ne répond pas (borne hors ligne, etc.), l'app continue de
// fonctionner normalement avec localStorage — c'est juste la copie de
// sûreté qui manquera pour cette sauvegarde.
function syncToServer(endpoint, data){
  try{
    fetch('/api/' + endpoint, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data),
    }).catch(()=>{});
  }catch(e){}
}

function loadProfiles(){ try{ return JSON.parse(localStorage.getItem('ws_profiles')||'{}'); }catch(e){ return {}; } }
function saveProfiles(p){ try{ localStorage.setItem('ws_profiles', JSON.stringify(p)); }catch(e){} syncToServer('profiles', p); }
function loadGlobalRatings(){ try{ return JSON.parse(localStorage.getItem('ws_global_ratings')||'{}'); }catch(e){ return {}; } }
function saveGlobalRatings(r){ try{ localStorage.setItem('ws_global_ratings', JSON.stringify(r)); }catch(e){} syncToServer('global-ratings', r); }

function useCustomer(){
  const [customer, setCustomer] = useState(()=>{
    try{ const id=localStorage.getItem('ws_current_customer'); if(!id) return null; return loadProfiles()[id]||null; }catch(e){ return null; }
  });
  const login = useCallback((cardId)=>{
    const id=(cardId||'').trim(); if(!id) return null;
    const profiles=loadProfiles();
    let prof=profiles[id];
    const isNew=!prof;
    if(!prof){ prof={id:id, name:'Client '+id.slice(-4).toUpperCase(), collection:{}, ratings:{}, createdAt:Date.now()}; }
    prof.lastVisit=Date.now();
    profiles[id]=prof; saveProfiles(profiles);
    try{ localStorage.setItem('ws_current_customer', id); }catch(e){}
    setCustomer({...prof});
    return {profile:prof, isNew:isNew};
  },[]);
  const logout = useCallback(()=>{ try{ localStorage.removeItem('ws_current_customer'); }catch(e){} setCustomer(null); },[]);
  // RGPD : droit à l'effacement — supprime intégralement le profil de la borne
  const erase = useCallback(()=>{
    setCustomer(prev=>{ if(prev){ const p=loadProfiles(); delete p[prev.id]; saveProfiles(p); } return null; });
    try{ localStorage.removeItem('ws_current_customer'); }catch(e){}
  },[]);
  const update = useCallback((fn)=>{
    setCustomer(prev=>{
      if(!prev) return prev;
      const next=fn({...prev});
      const profiles=loadProfiles(); profiles[next.id]=next; saveProfiles(profiles);
      return next;
    });
  },[]);
  return {customer:customer, login:login, logout:logout, update:update, erase:erase};
}

// ── COLLECTOR ─────────────────────────────────────────────────────────────────
function useCollector(customerApi) {
  const customer = customerApi ? customerApi.customer : null;
  const [anonCol, setAnonCol] = useState(() => {
    try { return JSON.parse(localStorage.getItem('ws_col') || '{}'); } catch { return {}; }
  });
  const collection = customer ? (customer.collection||{}) : anonCol;
  const addWine = useCallback((wineId) => {
    if (customer && customerApi) {
      customerApi.update(p=>({...p, collection:{...(p.collection||{}), [wineId]:((p.collection||{})[wineId]||0)+1}}));
    } else {
      setAnonCol(prev => {
        const next = {...prev, [wineId]: (prev[wineId]||0)+1};
        try{ localStorage.setItem('ws_col', JSON.stringify(next)); }catch(e){}
        return next;
      });
    }
  }, [customer, customerApi]);
  // Notation d'un vin par le client (1 à 5 étoiles) + agrégat global pour l'admin
  const rateWine = useCallback((wineId, stars) => {
    if (!customerApi || !customer) return;
    const prevStars = (customer.ratings||{})[wineId] || 0;
    customerApi.update(p=>({...p, ratings:{...(p.ratings||{}), [wineId]:stars}}));
    const g = loadGlobalRatings();
    const e = g[wineId] || {sum:0, count:0};
    if (prevStars>0) { e.sum = e.sum - prevStars + stars; }
    else { e.sum += stars; e.count += 1; }
    g[wineId] = e; saveGlobalRatings(g);
  }, [customer, customerApi]);
  const ratings = customer ? (customer.ratings||{}) : {};
  const totalCards = Object.keys(collection).length;
  const points = totalCards * 10;
  return {collection, addWine, totalCards, points, rateWine, ratings, customer};
}

// ── VOICE ─────────────────────────────────────────────────────────────────────
let recog = null;
let recogTranscript = '';

function useMic(onResult) {
  const [mic,        setMic]        = useState('off');
  const [transcript, setTranscript] = useState('');

  const startListening = () => {
    speechSynthesis.cancel();
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Micro non supporté — utilisez Chrome'); return; }
    recog = new SR();
    recog.lang = 'fr-FR';
    recog.continuous     = true;
    recog.interimResults = true;
    recogTranscript = '';

    recog.onstart  = () => { setMic('listening'); setTranscript(''); };

    recog.onresult = e => {
      let interim = '';
      let final   = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t + ' ';
        else interim += t;
      }
      recogTranscript += final;
      setTranscript((recogTranscript + interim).trim());
    };

    recog.onerror = e => {
      if (e.error !== 'no-speech') { setMic('off'); setTranscript(''); }
    };

    recog.start();
  };

  const validate = () => {
    if (recog) { try { recog.stop(); } catch(e) {} recog = null; }
    const text = (recogTranscript || transcript).trim();
    setMic('off'); setTranscript(''); recogTranscript = '';
    if (text) onResult(text, true);
  };

  const toggle = () => {
    if (mic === 'speaking')  { speechSynthesis.cancel(); setMic('off'); return; }
    if (mic === 'listening') { validate(); return; }
    startListening();
  };

  const speak = text => {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n+/g, '. ').trim());
    u.lang = 'fr-FR'; u.rate = 0.93;
    const fr = speechSynthesis.getVoices().find(v => v.lang.startsWith('fr'));
    if (fr) u.voice = fr;
    u.onstart = () => setMic('speaking');
    u.onend   = () => setMic('off');
    speechSynthesis.speak(u);
  };

  return {mic, toggle, speak, transcript};
}

RÈGLES :

CATALOGUE (${CATALOG.length} vins) : ${JSON.stringify(CATALOG)}`;

async function askSommelier(history, system) {
  try {
    const res = await fetch('http://localhost:3000/sommelier', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({system: system || SYS_PROMPT, messages: history, featuredIds: WINES.filter(w=>w.featured).map(w=>w.id)})
    });
    if (!res.ok) throw new Error('api');
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    const full = d.text;
    const m = full.match(/\[WINES:([\d,\s]+)\]/);
    const wines = m ? m[1].split(',').map(id=>WINES.find(w=>w.id===parseInt(id.trim()))).filter(Boolean) : [];
    return {text: full.replace(/\[WINES:[^\]]*\]/g,'').trim(), wines};
  } catch(e) { return localFallback(history[history.length-1].content); }
}

// ── Conversion des nombres en toutes lettres (dictée vocale) ────────────────
const FR_UNITS = {zero:0,un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,
  dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16};
const FR_TENS  = {vingt:20,trente:30,quarante:40,cinquante:50,soixante:60,septante:70,octante:80,nonante:90};
const FR_NUM_WORDS = Object.keys(FR_UNITS).concat(Object.keys(FR_TENS), ['cent','cents','mille']);
const FR_NUM_RE = new RegExp('\\b(?:' + FR_NUM_WORDS.join('|') + ')(?:[\\s-]+(?:' + FR_NUM_WORDS.join('|') + '))*\\b', 'gi');

function frenchWordsToNumber(phrase) {
  const words = phrase.toLowerCase().replace(/-/g, ' ').split(/\s+/).filter(w => w && w !== 'et');
  let result = 0, group = 0;
  for (const w of words) {
    if (w in FR_UNITS) group += FR_UNITS[w];
    else if (w in FR_TENS) { if (w === 'vingt' && group >= 2 && group <= 9) group = group * 20; else group += FR_TENS[w]; }
    else if (w === 'cent' || w === 'cents') { group = (group === 0 ? 1 : group) * 100; result += group; group = 0; }
    else if (w === 'mille') { group = (group === 0 ? 1 : group) * 1000; result += group; group = 0; }
  }
  return result + group;
}

function normalizeFrenchNumbers(text) {
  const merged = text.replace(/\b(vingt|trente|quarante|cinquante|soixante)\s+et\s+(un|une|onze)\b/gi, '$1-$2');
  return merged.replace(FR_NUM_RE, (match) => { const n = frenchWordsToNumber(match); return isNaN(n) ? match : String(n); });
}

function localFallback(msg) {
  const m = normalizeFrenchNumbers(msg.toLowerCase());
  let maxP = null, minP = 0;

  const range = m.match(/entre\s*(\d+)\s*(?:et|à|-)\s*(\d+)/);
  const floorOpen = m.match(/(\d+)\s*(?:€|euros?)?\s*(?:et\s+plus|ou\s+plus)/) || m.match(/(?:à\s+partir\s+de|au\s+moins|minimum)\s*(?:de)?\s*(\d+)/);
  const capped = m.match(/(?:moins\s+de|pas\s+plus\s+de|max(?:imum)?\s*(?:de)?)\s*(\d+)/);
  const exact  = m.match(/(\d+)\s*(?:€|euros?)/);

  if (range) { minP = parseInt(range[1]); maxP = parseInt(range[2]); }
  else if (floorOpen) { minP = parseInt(floorOpen[1]); maxP = minP * 3; }
  else if (capped) { maxP = parseInt(capped[1]); minP = Math.round(maxP*0.7); }
  else if (exact) { const p = parseInt(exact[1]); minP = Math.round(p*0.7); maxP = p; }

  // Filet de sécurité : si aucun budget n'est détecté du tout, on plafonne
  // par défaut à une fourchette grand public, sauf intention premium explicite.
  const premiumIntent = /peu importe le prix|grande occasion|grand cru|prestige|meilleur vin|sans limite/.test(m);
  if (maxP === null && !premiumIntent) { maxP = 45; minP = 0; }

  let pool = WINES.filter(w => (maxP===null || w.price<=maxP) && w.price>=minP);
  if (!pool.length) pool = [...WINES].filter(w => maxP===null || w.price <= maxP*1.05); // jamais au-dessus du budget
  if (!pool.length) pool = [...WINES];

  if (/\brosé\b/.test(m)) pool=pool.filter(w=>w.type==='rosé');
  else if (/champagne|bulle|crémant/.test(m)) pool=pool.filter(w=>w.type==='bulles');
  else if (/\bblanc\b/.test(m)) pool=pool.filter(w=>w.type==='blanc');
  else if (/\brouge\b/.test(m)) pool=pool.filter(w=>w.type==='rouge');

  return {text:`Voici ma sélection${maxP?' autour de '+maxP+'€':''}. Retournez les cartes pour les détails !`, wines:pool.sort((a,b)=>b.price-a.price).slice(0,3)};
}

          <span style={{width:56, height:1, background:C.bord2}}/>
          <span style={{width:6, height:6, transform:'rotate(45deg)', background:C.gold}}/>
          <span style={{width:56, height:1, background:C.bord2}}/>
        </div>
        <p style={{...serif, fontStyle:'italic', fontSize:22, color:C.body, margin:'18px 0 0'}}>Le sommelier de votre magasin</p>
      </div>

      {/* Action principale */}
      <div style={{width:'100%', maxWidth:560, margin:'0 auto', padding:'clamp(36px,7vh,64px) 24px 0'}}>
        <button onClick={()=>setView('selection')}
          style={{width:'100%', textAlign:'left', display:'flex', alignItems:'center', gap:20, padding:'30px 28px', background:C.wine, border:'none', borderRadius:20, cursor:'pointer', boxShadow:'0 22px 48px rgba(94,22,34,.18)', fontFamily:'Montserrat,sans-serif', transition:'transform .4s ease'}}
          onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';}} onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';}}>
          <div style={{flex:1}}>
            <div style={capsIv(11, '#d8bd84', {letterSpacing:'.24em', fontWeight:600, marginBottom:12})}>Sélection guidée</div>
            <div style={{...serif, fontSize:'clamp(1.9rem,6vw,2.4rem)', fontWeight:500, color:C.bg, lineHeight:1.05, marginBottom:10}}>Trouver mon vin idéal</div>
            <div style={{fontSize:14, color:'rgba(250,246,238,.75)', lineHeight:1.6}}>3 ou 4 questions, 3 vins choisis pour vous.</div>
          </div>
          <div style={{flexShrink:0, width:56, height:56, borderRadius:'50%', border:'1px solid rgba(216,189,132,.6)', display:'flex', alignItems:'center', justifyContent:'center', color:'#d8bd84'}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </div>
        </button>

        {/* Deux entrées secondaires */}
        <div style={{display:'grid', gridTemplateColumns:'repeat(2, minmax(0, 1fr))', gap:14, marginTop:14}}>
          {secondaires.map(item => (
            <button key={item.v} onClick={()=>setView(item.v)}
              style={{textAlign:'left', display:'flex', flexDirection:'column', gap:12, padding:'22px 20px', minHeight:140, background:C.cream, border:'1px solid ' + C.bord, borderRadius:18, cursor:'pointer', fontFamily:'Montserrat,sans-serif', transition:'border-color .3s'}}
              onMouseEnter={e=>survol(e,true)} onMouseLeave={e=>survol(e,false)}>
              {item.icone}
              <div>
                <div style={{...serif, fontSize:22, fontWeight:600, color:C.ink, lineHeight:1.1, marginBottom:5}}>{item.label}</div>
                <div style={{fontSize:13, color:C.muted, lineHeight:1.5}}>{item.sub}</div>
              </div>
            </button>
          ))}
        </div>

        {/* Ma collection (masquée pour l'instant) */}
        {FONCTIONS_CLIENT.maCave && <div style={{display:'flex', alignItems:'center', justifyContent:'center', gap:14, marginTop:30, flexWrap:'wrap'}}>
          <button onClick={()=>setView('collector')}
            style={{minHeight:44, padding:'0 18px', background:'transparent', border:'none', cursor:'pointer', fontFamily:'Montserrat,sans-serif', ...capsIv(11, C.wine, {letterSpacing:'.18em', fontWeight:600}), textDecoration:'underline', textUnderlineOffset:6, textDecorationColor:C.bord2}}>
            Ma collection
          </button>
          {collector.totalCards>0 && (
            <span style={{fontSize:13, color:C.muted}}>
              {collector.totalCards + ' vin' + (collector.totalCards>1?'s':'') + ' en cave'}
              {collector.discount>0 ? ' · −' + collector.discount + ' %' : ''}
            </span>
          )}
        </div>}
      </div>
    </div>
  );
}

// ── SELECTION ─────────────────────────────────────────────────────────────────
// Parcours guidé « Je cherche un vin pour… » (PARCOURS_GUIDE_V2)
//   … l'apéritif           → Quel type de vin ? → Qu'aimez-vous dans un vin ? → budget
//   … accompagner un repas → Qu'allez-vous manger ? (→ Comment est-il préparé ?) → budget → Avez-vous une préférence ?
//   … offrir               → Quel type de vin ? → Connaissez-vous ses goûts ? → budget
//   … cuisiner avec        → Quelle recette ? → budget
// Le choix des vins est fait par le serveur (/selection-accord, moteur d'accords).
const OCCASIONS_UI = [
  {id:'aperitif', label:"… l'apéritif",           desc:'Un verre, avec ou sans grignotage'},
  {id:'repas',    label:'… accompagner un repas', desc:'À boire avec votre plat'},
  {id:'offrir',   label:'… offrir',               desc:'Une bouteille qui fera plaisir'},
  {id:'cuisiner', label:'… cuisiner avec',        desc:'Le vin entre dans la recette'},
];
const GOUTS_UI = [
  {id:'leger_frais',     label:'Léger et frais',     desc:'Désaltérant, facile à boire'},
  {id:'fruite_gourmand', label:'Fruité et gourmand', desc:'Rond, plein de fruit'},
  {id:'riche_intense',   label:'Riche et intense',   desc:'De la matière, du caractère'},
  {id:'doux',            label:'Doux',               desc:'Une touche sucrée'},
  {id:'inconnu',         label:'Je ne sais pas',     desc:'Le sommelier vous guide'},
];
// Cadeau : « Je ne sais pas » formulé pour la personne qui reçoit
const GOUTS_OFFRIR_INCONNU = {id:'inconnu', label:'Je ne connais pas ses goûts', desc:'Le sommelier choisit une valeur sûre'};
// Apéritif et cadeau : goûts propres à la couleur choisie (le moteur d'accords les connaît sous ces id)
const GOUTS_PAR_COULEUR = {
  rouge: [
    {id:'rouge_leger',    label:'Léger et fruité',        desc:'Fruits rouges croquants, à servir frais'},
    {id:'rouge_rond',     label:'Rond et gourmand',       desc:'Fruit mûr, tanins soyeux'},
    {id:'rouge_puissant', label:'Puissant et charpenté',  desc:'De la matière et de la structure'},
  ],
  blanc: [
    {id:'blanc_vif',        label:'Vif et minéral',        desc:'Tendu, citronné, désaltérant'},
    {id:'blanc_aromatique', label:'Aromatique et fruité',  desc:'Fleurs blanches, fruits exotiques'},
    {id:'blanc_beurre',     label:'Rond et beurré',        desc:'Chardonnay, notes de beurre et de brioche'},
    {id:'blanc_moelleux',   label:'Moelleux ou liquoreux', desc:'Une douceur fruitée'},
  ],
  'rosé': [
    {id:'rose_pale',   label:'Pâle et léger',          desc:'Sec, délicat, très frais'},
    {id:'rose_fruite', label:'Fruité et gourmand',     desc:'Fraise, framboise, tout en rondeur'},
    {id:'rose_vineux', label:'Soutenu, de caractère',  desc:'Plus coloré, de la matière'},
    {id:'rose_tendre', label:'Tendre, une pointe de douceur', desc:'Demi-sec, fruité et gourmand'},
  ],
  bulles: [
    {id:'bulles_vives',    label:'Vives et légères',       desc:'Brut, tendues, désaltérantes'},
    {id:'bulles_fruitees', label:'Fruitées et gourmandes', desc:'Fruit frais, bulle fine'},
    {id:'bulles_vineuses', label:'Vineuses et briochées',  desc:'De la matière, notes de brioche grillée'},
    {id:'bulles_douces',   label:'Douces',                 desc:'Demi-sec, une touche sucrée'},
  ],
};
const RECETTES_UI = [
  {id:'bourguignon', label:'Bœuf bourguignon',          couleur:'rouge'},
  {id:'coq_au_vin',  label:'Coq au vin',                couleur:'rouge'},
  {id:'moules',      label:'Moules marinières',         couleur:'blanc'},
  {id:'risotto',     label:'Risotto',                   couleur:'blanc'},
  {id:'fondue',      label:'Fondue savoyarde',          couleur:'blanc'},
  {id:'sauce',       label:'Une sauce ou un déglaçage', couleur:null},
];

function OccasionIcon({id, size=30, color}) {
  const c = color || C.wine;
  const s = {fill:'none', stroke:c, strokeWidth:1.6, strokeLinecap:'round', strokeLinejoin:'round'};
  if (id === 'aperitif') return <PairingIcon id="apéritif" color={c} size={size}/>;
  if (id === 'repas') return (
    <svg width={size} height={size} viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="17" r="8" {...s}/><circle cx="16" cy="17" r="4.5" {...s}/>
      <path d="M4 7v6c0 1.2.8 2 2 2v10M6 7v5M8 7v6c0 1.2-.8 2-2 2" {...s}/>
      <path d="M27 7c-2 1-2.5 4-2.5 7h2.5v11" {...s}/>
    </svg>);
  if (id === 'offrir') return (
    <svg width={size} height={size} viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="13" width="20" height="13" rx="1.5" {...s}/><rect x="4.5" y="9.5" width="23" height="3.5" rx="1" {...s}/>
      <path d="M16 9.5V26" {...s}/><path d="M16 9.5c-1.5-3.5-6-4.5-6-1.5 0 1.8 3.5 1.5 6 1.5zM16 9.5c1.5-3.5 6-4.5 6-1.5 0 1.8-3.5 1.5-6 1.5z" {...s}/>
    </svg>);
  if (id === 'cuisiner') return (
    <svg width={size} height={size} viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 14h18v7c0 2.8-2.2 5-5 5h-8c-2.8 0-5-2.2-5-5v-7z" {...s}/>
      <path d="M4 14h3M25 14h3M11 14c0-2 2-3 5-3s5 1 5 3" {...s}/>
      <path d="M13 8c0-1.2 1-1.4 1-2.6M17.5 8c0-1.2 1-1.4 1-2.6" {...s}/>
    </svg>);

}

function Selection({setView, setResults}) {
  const C = C_IVOIRE;   // écran en direction « Ivoire épuré »
  const [screen,   setScreen]   = useState('occasion');
  const [hist,     setHist]     = useState([]);
  const [occasion, setOccasion] = useState(null);
  const [gout,     setGout]     = useState(null);
  const [pairing,  setPairing]  = useState(null);
  const [detail,   setDetail]   = useState(null);   // {id, label}
  const [platLibre, setPlatLibre] = useState('');
  const [recette,  setRecette]  = useState(null);
  const [recetteLibre, setRecetteLibre] = useState('');
  const [budget,   setBudget]   = useState(null);
  const [couleur,  setCouleur]  = useState(null);
  const [texte,    setTexte]    = useState('');     // saisie de l'écran « Dites-le »
  const [info,     setInfo]     = useState(null);   // recette sans vin
  const [conseils, setConseils] = useState(null);   // repas : couleurs conseillées pour le plat
  const {mic, toggle, transcript} = useMic(t => setTexte(prev => (prev ? prev + ' ' : '') + t));

  const go = s => { setHist(h => h.concat([screen])); setScreen(s); };
  const back = () => {
    if (screen === 'thinking') return;
    if (!hist.length) { setView('home'); return; }
    setScreen(hist[hist.length - 1]);
    setHist(h => h.slice(0, -1));
  };

  const apero = occasion === 'aperitif';
  const offrir = occasion === 'offrir';
  const typeDabord = apero || offrir;   // la couleur est demandée avant les goûts
  const total = occasion === 'repas' || typeDabord ? 4 : 3;
  const STEP = typeDabord
    ? {occasion:1, couleur:2, gout:3, budget:4, thinking:total}
    : {occasion:1, gout:2, plat:2, precision:2, libre:2, recette:2, budget:3, couleur:4, info:2, thinking:total};
  const LABEL = {
    occasion:'Occasion', gout: occasion === 'offrir' ? 'Ses goûts' : 'Vos goûts', plat:'Votre plat',
    precision:'Préparation', libre: occasion === 'cuisiner' ? 'Votre recette' : 'Votre plat',
    recette:'Votre recette', budget:'Budget', couleur: typeDabord ? 'Type de vin' : 'Préférence', info:'Votre recette', thinking:'Sélection',
  };
  const step = STEP[screen] || 1;
  const count = filterWines(couleur, budget, null).length;

  // ── Choix ────────────────────────────────────────────────────────────────
  const pickOccasion = o => {
    setOccasion(o); setGout(null); setPairing(null); setDetail(null); setPlatLibre('');
    setRecette(null); setRecetteLibre(''); setCouleur(null); setTexte('');
    go(o === 'repas' ? 'plat' : o === 'cuisiner' ? 'recette' : 'couleur');
  };
  const pickGout = g => { setGout(g); go('budget'); };
  const pickPairing = p => {
    setPairing(p); setDetail(null); setPlatLibre('');
    go(PAIRING_DETAILS[p] ? 'precision' : 'budget');
  };
  const pickDetail = d => { setDetail(d); go('budget'); };
  const pickRecette = r => { setRecette(r); setRecetteLibre(''); go('budget'); };
  const ouvrirLibre = () => { setTexte(occasion === 'cuisiner' ? recetteLibre : platLibre); go('libre'); };
  const validerLibre = () => {
    const t = (texte || transcript || '').trim();
    if (!t) return;
    if (occasion === 'cuisiner') { setRecetteLibre(t); setRecette(null); }
    else { setPlatLibre(t); setPairing(null); setDetail(null); }
    go('budget');
  };
  const pickBudget = b => {
    setBudget(b);
    if (occasion === 'repas') {
      // Plat choisi dans la liste : le moteur indique les couleurs qui s'accordent (pas pour un plat saisi librement)
      setConseils(null);
      if (pairing && !platLibre) {
        fetch('http://localhost:3000/couleurs-conseillees', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({pairing: pairing, detail: detail ? detail.id : null, budget: b}),
        }).then(r => r.json()).then(d => setConseils(d.couleurs || null)).catch(() => {});
      }
      go('couleur');
    }
    else run({budget:b});
  };
  // Apéritif et cadeau : le type de vin est la première question, on enchaîne ensuite sur les goûts.
  const pickCouleur = c => {
    setCouleur(c);
    if (typeDabord) { setGout(null); go('gout'); }
    else run({couleur:c});
  };

  // ── Repli local si le serveur ne répond pas ──────────────────────────────
  const withFallbackRoles = wines => {
    if (wines.length < 3) return wines;
    const byPrice = [...wines].sort((a,b) => a.price - b.price);
    const roles = {[byPrice[0].id]:'valeur_sure'};
    const rest = wines.filter(w => w.id !== byPrice[0].id);
    roles[rest[0].id] = 'coup_de_coeur';
    roles[rest[1].id] = 'decouverte';
    return wines.map(w => ({...w, aiRole: roles[w.id]}));
  };
  const localFallback = o => {
    const rec = RECETTES_UI.find(x => x.id === o.recette);
    const type = o.couleur || (o.occasion === 'cuisiner' && rec ? rec.couleur : null);
    const p = o.occasion === 'repas' ? o.pairing : o.occasion === 'aperitif' ? 'apéritif' : null;
    // Apéritif et cadeau avec un goût précis : les vins les plus proches de ce goût, à prix croissants
    const parGout = (o.occasion === 'aperitif' || o.occasion === 'offrir') && o.gout && o.gout !== 'inconnu' && Object.keys(PROFILS_VINS).length;
    let r = parGout
      ? filterWines(type, o.budget, null).map((w, i) => ({w: w, i: i, s: noteGoutLocale(w, o.gout)}))
          .sort((a, b) => (b.s - a.s) || (a.i - b.i)).slice(0,3).map(x => x.w).sort((a, b) => a.price - b.price)
      : filterWines(type, o.budget, p).slice(0,3);
    if (r.length < 3) { const e = filterWines(type, o.budget, null).filter(w => !r.find(x => x.id === w.id)); r = [...r, ...e].slice(0,3); }
    if (r.length < 3) { const e = filterWines(type, null, null).filter(w => !r.find(x => x.id === w.id)); r = [...r, ...e].slice(0,3); }
    return withFallbackRoles(r);
  };

  // ── Envoi au serveur ─────────────────────────────────────────────────────
  const run = over => {
    const o = Object.assign({
      occasion: occasion, gout: gout, pairing: pairing, detail: detail ? detail.id : null,
      platLibre: platLibre, recette: recette, recetteLibre: recetteLibre, budget: budget, couleur: couleur,
    }, over || {});
    setHist(h => h.concat([screen]));
    setScreen('thinking');
    fetch('http://localhost:3000/selection-accord', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({}, o, {featuredIds: WINES.filter(w => w.featured).map(w => w.id)})),
    })
      .then(res => { if (!res.ok) throw new Error('api'); return res.json(); })
      .then(d => {
        if (d.info === 'sansVin') { setInfo({plat: d.plat || o.recetteLibre}); setScreen('info'); return; }
        if (d.error || !Array.isArray(d.ids)) throw new Error(d.error || 'réponse invalide');
        let r = d.ids.map(id => WINES.find(w => w.id === id)).filter(Boolean);
        // Pas de repli local ici : si le moteur d'accords renvoie peu de vins, c'est qu'il a
        // écarté les autres volontairement (ex. rouge tannique sur fruits de mer). Le repli
        // local (filtre prix/couleur sans accord) ne sert qu'en cas de panne du serveur
        // ou de réponse vide (jamais d'écran sans vin).
        if (!r.length) r = localFallback(o);
        else if (d.roles && r.every(w => d.roles[w.id])) r = r.map(w => ({...w, aiReason:(d.reasons||{})[w.id], aiRole:d.roles[w.id]}));
        else r = withFallbackRoles(r).map(w => ({...w, aiReason:(d.reasons||{})[w.id]}));
        r = r.map(w => ({...w, accord:(d.niveaux||{})[w.id]}));
        r.message = d.message || '';
        setResults(r); setView('results');
      })
      .catch(e => { console.warn('Sélection guidée : repli local (' + e.message + ')'); setResults(localFallback(o)); setView('results'); });
  };

  // ── Éléments d'interface ─────────────────────────────────────────────────
  const titre = t => <h2 style={{...serif, fontSize:'clamp(1.9rem,5vw,2.5rem)', fontWeight:500, lineHeight:1.08, letterSpacing:'-.01em', color:C.ink, textAlign:'center', margin:'6px 0 26px'}}>{t}</h2>;
  const hover = (e, on) => { e.currentTarget.style.borderColor = on ? C.wine : C.bord; };
  const Carte = ({label, desc, onClick, icon, accent}) => (
    <div onClick={onClick} onMouseEnter={e => hover(e, true)} onMouseLeave={e => hover(e, false)}
      style={{background:accent ? C.soft : C.cream, border:'1px solid ' + C.bord, borderRadius:16, padding:'18px 20px', minHeight:72, cursor:'pointer', transition:'border-color .3s', display:'flex', alignItems:'center', gap:16}}>
      {icon && <div style={{flexShrink:0, display:'flex'}}>{icon}</div>}
      <div style={{flex:1, textAlign:'left'}}>
        <div style={{...serif, fontSize:21, fontWeight:600, color:C.ink, lineHeight:1.2}}>{label}</div>
        {desc && <div style={{fontSize:13, color:C.muted, marginTop:3}}>{desc}</div>}
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.bord2} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={{flexShrink:0}}><path d="M9 5l7 7-7 7"/></svg>
    </div>
  );
  const BoutonLibre = ({label, onClick}) => (
    <div onClick={onClick} onMouseEnter={e => e.currentTarget.style.borderColor = C.wine} onMouseLeave={e => e.currentTarget.style.borderColor = C.bord2}
      style={{gridColumn:'1 / -1', marginTop:6, background:'transparent', border:'1px dashed ' + C.bord2, borderRadius:14, padding:'16px 10px', minHeight:56, textAlign:'center', cursor:'pointer', color:C.wine, fontSize:17, ...serif, fontWeight:600, transition:'border-color .3s'}}>
      {label}
    </div>
  );
  // Couleur choisie : les goûts de cette couleur. Pour un cadeau, « Je ne sais pas » passe en premier
  // (on connaît rarement les goûts précis de la personne).
  const inconnu = offrir ? GOUTS_OFFRIR_INCONNU : GOUTS_UI[4];
  const goutsCouleur = typeDabord && GOUTS_PAR_COULEUR[couleur];
  const goutsOrdre = goutsCouleur ? (offrir ? [inconnu].concat(goutsCouleur) : goutsCouleur.concat([inconnu]))
    : offrir ? [inconnu].concat(GOUTS_UI.slice(0,4)) : GOUTS_UI;
  const platsOpts = PAIRINGS.filter(p => p.id !== 'apéritif');

  return (
    <div style={{minHeight:'100vh', background:C.bg, color:C.ink, paddingBottom:96}}>
      <EnteteIvoire onBack={screen === 'thinking' ? null : back}
        droite={screen !== 'thinking' && (couleur || budget) ? <span style={capsIv(10, C.muted, {letterSpacing:'.14em'})}>{count + ' vins'}</span> : null}/>
      <div style={{padding:'18px 24px 0', maxWidth:560, margin:'0 auto'}}>
        <div style={capsIv(11, C.gold, {letterSpacing:'.22em', textAlign:'center', marginBottom:10})}>{'Étape ' + Math.min(step, total) + ' sur ' + total + ' · ' + (LABEL[screen] || '')}</div>
        <div style={{display:'flex', gap:6}}>
          {Array.from({length: total}, (_, i) => i + 1).map(i => <div key={i} style={{flex:1, height:2, borderRadius:2, background: step >= i ? C.wine : C.bord, transition:'background .5s'}}/>)}
        </div>
      </div>
      <div style={{maxWidth:560, margin:'0 auto', padding:'28px 24px'}}>

        {screen === 'occasion' && (
          <div>
            {titre('Je cherche un vin pour…')}
            <div style={{display:'grid', gridTemplateColumns:'1fr', gap:10, maxWidth:440, margin:'0 auto'}}>
              {OCCASIONS_UI.map(o => <Carte key={o.id} label={o.label} desc={o.desc} icon={<OccasionIcon id={o.id}/>} onClick={() => pickOccasion(o.id)}/>)}
            </div>
          </div>
        )}

        {screen === 'gout' && (
          <div>
            {titre(offrir ? (couleur ? 'Connaissez-vous ses goûts en ' + couleur + ' ?' : 'Connaissez-vous ses goûts ?')
              : apero && couleur === 'bulles' ? 'Quel style de bulles ?'
              : apero && couleur ? 'Quel style de ' + couleur + ' ?'
              : "Qu'aimez-vous dans un vin ?")}
            <div style={{display:'grid', gridTemplateColumns:'1fr', gap:9, maxWidth:440, margin:'0 auto'}}>

                  onMouseEnter={e => { e.currentTarget.style.borderColor = C.wine; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = C.bord; }}>
                  <div style={{...serif, fontSize:18, color:C.ink, fontWeight:600, lineHeight:1.2}}>{r.label}</div>
                </div>
              ))}
              <BoutonLibre label="Une autre recette ? Dites-la" onClick={ouvrirLibre}/>
            </div>
          </div>
        )}

        {screen === 'libre' && (
          <div>
            {titre(occasion === 'cuisiner' ? 'Décrivez votre recette' : 'Décrivez votre plat')}
            <div style={{background:C.cream, border:'1px solid ' + C.bord, borderRadius:18, padding:'22px 20px'}}>
              <div style={{display:'flex', gap:10, alignItems:'center', marginBottom:14}}>
                <input value={mic === 'listening' && transcript ? transcript : texte} onChange={e => setTexte(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && validerLibre()} autoFocus
                  placeholder={occasion === 'cuisiner' ? 'Ex. : blanquette, poires au vin…' : 'Ex. : hachis parmentier, poulet basquaise…'}
                  style={{flex:1, minWidth:0, background:C.bg, border:'1px solid ' + C.bord2, color:C.ink, borderRadius:12, padding:'15px 16px', fontSize:17, outline:'none', fontFamily:'Montserrat,sans-serif'}}/>
                <button onClick={toggle} title={mic === 'listening' ? 'Terminer la dictée' : 'Dicter'} aria-label={mic === 'listening' ? 'Terminer la dictée' : 'Dicter'}
                  style={{width:52, height:52, borderRadius:'50%', border:'1px solid ' + (mic === 'listening' ? C.wine : C.bord2), cursor:'pointer', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', background: mic === 'listening' ? C.wine : C.cream, color: mic === 'listening' ? C.bg : C.wine, animation: mic === 'listening' ? 'pulseIv 1.6s ease-in-out infinite' : 'none'}}>
                  {mic === 'listening'
                    ? <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                    : <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>}
                </button>

              {mic === 'listening' && <div style={{fontSize:13, color:C.wine, marginBottom:12, textAlign:'center'}}>Parlez… touchez à nouveau le micro pour terminer</div>}
              <button onClick={validerLibre} disabled={!(texte || '').trim()} style={{width:'100%', minHeight:56, background:(texte || '').trim() ? C.wine : C.bord, color:C.bg, border:'none', borderRadius:999, cursor:(texte || '').trim() ? 'pointer' : 'default', fontFamily:'Montserrat,sans-serif', fontSize:15, fontWeight:600, letterSpacing:'.03em'}}>Valider</button>
            </div>
            <style>{'@keyframes pulseIv{0%,100%{box-shadow:0 0 0 0 rgba(94,22,34,.35)}50%{box-shadow:0 0 0 10px rgba(94,22,34,0)}}'}</style>
          </div>
        )}

        {screen === 'budget' && (
          <div>
            {titre('Quel est votre budget ?')}
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
              {BUDGETS.map((b, i) => (
                <div key={b.id} onClick={() => pickBudget(b.id)} style={{gridColumn:(i === BUDGETS.length - 1 && BUDGETS.length % 2) ? '1 / -1' : 'auto', background:budget === b.id ? C.soft : C.cream, border:'1px solid ' + (budget === b.id ? C.wine : C.bord), borderRadius:16, padding:'22px 14px', minHeight:104, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center', cursor:'pointer', transition:'border-color .3s'}}
                  onMouseEnter={e => e.currentTarget.style.borderColor = C.wine}
                  onMouseLeave={e => { if (budget !== b.id) e.currentTarget.style.borderColor = C.bord; }}>
                  <div style={{...serif, fontSize:26, fontWeight:600, color:C.wine, marginBottom:6, lineHeight:1}}>{b.label}</div>
                  <div style={capsIv(10, C.muted, {letterSpacing:'.14em'})}>{b.desc}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {screen === 'couleur' && (
          <div>
            {titre(offrir ? 'Quel type de vin offrir ?' : apero ? 'Quel type de vin ?' : 'Avez-vous une préférence ?')}
            <div>
              <div style={{marginBottom:12}}>
                <Carte label={offrir ? 'Je ne sais pas, conseillez-moi' : 'Peu importe, conseillez-moi'} desc={offrir ? 'Le sommelier choisit une valeur sûre, qui fait plaisir' : 'Le sommelier choisit la couleur qui va le mieux'} accent={true} onClick={() => pickCouleur(null)}/>
              </div>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
                {TYPES.map(t => (
                  <div key={t.id} onClick={() => pickCouleur(t.id)} style={{background:C.cream, border:'1px solid ' + C.bord, borderRadius:16, padding:'20px 14px', minHeight:120, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center', cursor:'pointer', transition:'border-color .3s'}}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = t.color; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = C.bord; }}>
                    <div style={{marginBottom:8, display:'flex', justifyContent:'center'}}><TypeIcon id={t.id} color={t.color} size={38}/></div>
                    <div style={{...serif, fontSize:22, color:C.ink, fontWeight:600}}>{t.label}</div>
                    {occasion === 'repas' && conseils && conseils[t.id] === 'conseille' && (
                      <div style={{marginTop:8, background:C.wine, color:C.bg, borderRadius:999, padding:'4px 12px', ...capsIv(9, C.bg, {letterSpacing:'.12em', fontWeight:600})}}>Conseillé avec ce plat</div>
                    )}
                    {occasion === 'repas' && conseils && conseils[t.id] === 'compromis' && (
                      <div style={{marginTop:8, color:C.muted, fontSize:12, fontStyle:'italic'}}>Accord moins évident</div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {screen === 'info' && info && (
          <div style={{textAlign:'center', maxWidth:420, margin:'0 auto', padding:'30px 10px'}}>
            <div style={{...serif, fontSize:21, color:C.wine, marginBottom:10}}>{'La recette « ' + info.plat + ' » ne contient généralement pas de vin.'}</div>
            <p style={{fontSize:13, color:C.muted, lineHeight:1.7, marginBottom:22}}>Voulez-vous plutôt un vin pour accompagner ce plat ?</p>
            <div style={{display:'flex', flexDirection:'column', gap:10}}>
              <button onClick={() => { setOccasion('repas'); setPlatLibre(info.plat); run({occasion:'repas', platLibre:info.plat, couleur:null}); }}
                style={{background:C.wine, color:'#fdf8f0', border:'none', borderRadius:50, padding:'12px 22px', cursor:'pointer', fontFamily:'Montserrat,sans-serif', fontSize:14, fontWeight:600}}>Oui, un vin pour accompagner ce plat</button>
              <button onClick={() => { setInfo(null); setHist(h => h.filter(s => s !== 'thinking')); setScreen('recette'); }}
                style={{background:'transparent', color:C.wine, border:'1.5px solid ' + C.bord2, borderRadius:50, padding:'11px 22px', cursor:'pointer', fontFamily:'Montserrat,sans-serif', fontSize:13}}>Changer de recette</button>
            </div>
          </div>
        )}

        {screen === 'thinking' && (
          <div style={{textAlign:'center', padding:'70px 20px'}}>
            <div style={{display:'flex', justifyContent:'center', marginBottom:22, animation:'pulse 2.2s ease-in-out infinite'}}><TypeIcon id="rouge" color={C.wine} size={56}/></div>
            <div style={{...serif, fontSize:28, fontWeight:500, color:C.ink}}>Le sommelier choisit vos vins…</div>
            <div style={{fontSize:14, color:C.muted, marginTop:10, lineHeight:1.6}}>
              {occasion === 'cuisiner' ? 'Il cherche le vin qui convient à votre recette'
                : occasion === 'repas' ? 'Il compare cépages, régions et accords pour votre plat'
                : 'Il compare les styles et les appellations selon vos goûts'}
            </div>
            <style>{'@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(1.08);}}'}</style>
          </div>
        )}
      </div>
    </div>
  );
}

// ── RESULTS ───────────────────────────────────────────────────────────────────
function Results({results, setView, collector}) {
  const [modal, setModal] = useState(null);
  const [added, setAdded] = useState(null);
  const handleCollect = wine => { collector.addWine(wine.id); setAdded(wine.id); setTimeout(()=>setAdded(null),2500); };
  // Le libellé vient du rôle réel du vin (aiRole, assigné par le sommelier ou par
  // l'heuristique de repli) — jamais de sa position dans le tableau. Le
  // DEFAULT_ROLE_ORDER n'est qu'un ultime filet de sécurité.
  const labelFor = (w,i) => ROLE_LABELS[w.aiRole] || ROLE_LABELS[DEFAULT_ROLE_ORDER[i]] || '';

  // Palette « ivoire épuré » (direction B) — locale à cet écran pour l'instant
  const IV = {bg:'#faf6ee', surface:'#ffffff', soft:'#f3ece0', line:'#e6dccb', line2:'#c9b99f',
              ink:'#2a1215', body:'#4d3a35', muted:'#6e5a50', wine:'#5e1622', gold:'#8a6a2e'};
  const sans = {fontFamily:'Montserrat,sans-serif'};
  const caps = (size, color, extra) => Object.assign({fontSize:size, letterSpacing:'.18em', textTransform:'uppercase', color:color}, extra||{});
  const prix = p => String(p).replace('.', ',') + ' €';
  const enCave = w => added===w.id || (collector.collection[w.id]||0) > 0;

  const BoutonCave = ({w, small}) => !FONCTIONS_CLIENT.maCave ? null : (
    <button onClick={e=>{e.stopPropagation(); handleCollect(w);}}
      style={{...sans, minHeight:small?40:52, padding:small?'0 14px':'0 22px', background:enCave(w)?IV.soft:'transparent', border:'1px solid '+(enCave(w)?IV.line2:IV.wine), borderRadius:999, color:IV.wine, fontSize:small?12:14, fontWeight:500, cursor:'pointer', whiteSpace:'nowrap'}}>
      {added===w.id ? '✓ Ajouté à ma cave' : enCave(w) ? '✓ Dans ma cave' : 'Garder dans ma cave'}
    </button>
  );

  if (!results.length) return (
    <div style={{minHeight:'100vh', background:IV.bg, color:IV.ink}}>
      <div style={{textAlign:'center', padding:'90px 28px'}}>
        <h2 style={{...serif, fontSize:34, fontWeight:500, color:IV.ink, margin:'0 0 10px'}}>Aucun vin ne correspond</h2>
        <p style={{fontSize:14, color:IV.muted, marginBottom:26}}>Essayez un autre budget, ou décrivez votre plat au sommelier.</p>
        <div style={{display:'flex', gap:12, justifyContent:'center', flexWrap:'wrap'}}>
          <button onClick={()=>setView('selection')} style={{...sans, minHeight:52, padding:'0 26px', background:IV.wine, color:IV.bg, border:'none', borderRadius:999, fontSize:14, fontWeight:600, cursor:'pointer'}}>Réessayer</button>
          <button onClick={()=>setView('chat')} style={{...sans, minHeight:52, padding:'0 26px', background:'transparent', color:IV.ink, border:'1px solid '+IV.line2, borderRadius:999, fontSize:14, cursor:'pointer'}}>Demander au sommelier</button>
        </div>
      </div>
    </div>
  );

  // Le vin mis en avant : le coup de cœur s'il existe, sinon le vin du milieu
  const heroIdx = Math.max(0, results.findIndex(w => w.aiRole === 'coup_de_coeur'));
  const hero = results[heroIdx >= 0 ? heroIdx : 0];
  const autres = results.map((w,i)=>({w:w, i:i})).filter(x => x.w.id !== hero.id);
  const nb = results.length;

  return (
    <div style={{minHeight:'100vh', background:IV.bg, color:IV.ink, paddingBottom:96}}>
      {/* En-tête */}
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'22px 24px 18px', borderBottom:'1px solid '+IV.line}}>
        <button onClick={()=>setView('selection')} style={{...sans, display:'flex', alignItems:'center', gap:8, minHeight:46, padding:'0 18px 0 12px', background:'transparent', border:'1px solid '+IV.line2, borderRadius:999, color:IV.ink, fontSize:13, letterSpacing:'.04em', cursor:'pointer'}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          Retour
        </button>
        <div style={{...serif, fontSize:22, fontWeight:600, color:IV.wine, letterSpacing:'.02em'}}>WineSelect</div>
        <div style={{width:96}}/>
      </div>

      <div style={{padding:'0 24px'}}>
        {/* Titre */}
        <div style={{padding:'32px 0 0'}}>
          <div style={caps(11, IV.gold, {letterSpacing:'.24em', marginBottom:10})}>Votre sélection</div>
          <h1 style={{...serif, margin:0, fontSize:'clamp(2.2rem,6vw,3.1rem)', fontWeight:500, lineHeight:1.04, letterSpacing:'-.01em', color:IV.ink}}>
            {nb===3 ? 'Trois vins choisis pour vous' : nb===2 ? 'Deux vins choisis pour vous' : 'Le vin choisi pour vous'}
          </h1>
          {results.message && <p style={{margin:'14px 0 0', fontSize:13, lineHeight:1.6, color:IV.body, background:IV.soft, borderRadius:12, padding:'10px 14px'}}>{results.message}</p>}
        </div>

        {/* Vin principal */}
        <div onClick={()=>setModal(hero)} style={{marginTop:26, display:'flex', gap:24, padding:24, background:IV.surface, border:'1px solid '+IV.line, borderRadius:20, boxShadow:'0 18px 40px rgba(94,22,34,.08)', cursor:'pointer'}}>
          <div style={{flexShrink:0, width:140, minHeight:280, borderRadius:12, background:IV.soft, display:'flex', alignItems:'center', justifyContent:'center'}}>
            <PhotoVin wine={hero} h={240}/>
          </div>
          <div style={{flex:1, minWidth:0, display:'flex', flexDirection:'column', gap:12}}>
            <div style={{display:'flex', alignItems:'center', gap:9, ...caps(11, IV.wine, {fontWeight:600, letterSpacing:'.2em'})}}>
              <span style={{width:7, height:7, background:IV.wine, transform:'rotate(45deg)'}}/>
              {labelFor(hero, heroIdx)}
            </div>
            <div>
              {surtitreVin(hero) && <div style={caps(12, IV.gold, {fontWeight:600, letterSpacing:'.16em', marginBottom:6})}>{surtitreVin(hero)}</div>}
              <h2 style={{...serif, margin:0, fontSize:'clamp(1.8rem,5vw,2.5rem)', fontWeight:600, lineHeight:1.04, color:IV.ink}}>{nomVin(hero)}</h2>
            </div>
            <div style={caps(11, IV.muted, {letterSpacing:'.14em', lineHeight:1.5})}>{detailsVin(hero)}</div>
            <div style={{height:1, background:IV.line}}/>
            {(hero.aiReason || hero.tastingNotes) && <p style={{...serif, margin:0, fontStyle:'italic', fontSize:19, lineHeight:1.4, color:'#3f2a26'}}>{hero.aiReason || hero.tastingNotes}</p>}
            <EmplacementVin wine={hero} grand={true}/>
            <div style={{marginTop:'auto', display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:12, flexWrap:'wrap', paddingTop:6}}>
              <div style={{display:'flex', flexDirection:'column', gap:5}}>
                {hero.accord && <span style={caps(10, IV.gold)}>{hero.accord}</span>}
                <span style={{...serif, fontSize:46, fontWeight:600, lineHeight:.9, color:IV.wine}}>{prix(hero.price)}</span>
              </div>
              <BoutonCave w={hero}/>
            </div>
          </div>
        </div>

        {/* Autres vins */}
        {autres.length>0 && (
          <div style={{marginTop:16, display:'grid', gridTemplateColumns:autres.length>1?'repeat(2, minmax(0, 1fr))':'1fr', gap:16}}>
            {autres.map(({w,i})=>(
              <div key={w.id} onClick={()=>setModal(w)} style={{display:'flex', flexDirection:'column', gap:10, padding:20, background:IV.surface, border:'1px solid '+IV.line, borderRadius:16, cursor:'pointer'}}>
                <div style={caps(10, IV.gold, {fontWeight:600, letterSpacing:'.2em'})}>{labelFor(w,i)}</div>
                <div style={{height:150, borderRadius:10, background:IV.soft, display:'flex', alignItems:'center', justifyContent:'center'}}>
                  <PhotoVin wine={w} h={130}/>
                </div>
                <div>
                  {surtitreVin(w) && <div style={caps(10, IV.gold, {fontWeight:600, letterSpacing:'.14em', marginBottom:5})}>{surtitreVin(w)}</div>}
                  <h3 style={{...serif, margin:0, fontSize:24, fontWeight:600, lineHeight:1.08, color:IV.ink}}>{nomVin(w)}</h3>
                </div>
                <div style={caps(10, IV.muted, {letterSpacing:'.12em', lineHeight:1.5})}>{detailsVin(w)}</div>
                {(w.aiReason || w.tastingNotes) && <p style={{margin:0, fontSize:13, lineHeight:1.6, color:IV.body}}>{w.aiReason || w.tastingNotes}</p>}
                <EmplacementVin wine={w}/>
                <div style={{marginTop:'auto', display:'flex', alignItems:'baseline', justifyContent:'space-between', paddingTop:6}}>
                  <span style={{...serif, fontSize:32, fontWeight:600, color:IV.wine}}>{prix(w.price)}</span>
                  {w.accord && <span style={{fontSize:11, color:IV.muted}}>{w.accord}</span>}
                </div>
                <BoutonCave w={w} small={true}/>
              </div>
            ))}
          </div>
        )}

        {/* Actions */}
        <div style={{marginTop:28, display:'flex', gap:12, flexWrap:'wrap'}}>
          <button onClick={()=>setView('home')} style={{...sans, flex:1, minWidth:200, minHeight:58, background:IV.wine, border:'none', borderRadius:999, color:IV.bg, fontSize:15, fontWeight:600, letterSpacing:'.03em', cursor:'pointer'}}>Nouvelle recherche</button>
          <button onClick={()=>setView('chat')} style={{...sans, flex:1, minWidth:200, minHeight:58, background:'transparent', border:'1px solid '+IV.line2, borderRadius:999, color:IV.ink, fontSize:15, cursor:'pointer'}}>Demander au sommelier</button>
        </div>
      </div>
      {modal && <WineModal wine={modal} onClose={()=>setModal(null)} onCollect={FONCTIONS_CLIENT.maCave ? ()=>{handleCollect(modal);setModal(null);} : null}/>}
    </div>
  );
}

// ── MYSTERY ───────────────────────────────────────────────────────────────────
function Mystery({setView, collector}) {
  const I = C_IVOIRE;
  const sans = {fontFamily:'Montserrat,sans-serif'};
  const [wine,  setWine]  = useState(null);
  const [added, setAdded] = useState(false);
  const reveal = () => {
    const pool = WINES.filter(w=>w.price>=8&&w.price<=30);
    setWine(pool[Math.floor(Math.random()*pool.length)]);
    setAdded(false);
  };
  const enCave = wine && (added || (collector.collection[wine.id]||0) > 0);
  const Losange = () => (
    <div style={{display:'flex', alignItems:'center', justifyContent:'center', gap:12, margin:'18px auto'}}>
      <span style={{width:48, height:1, background:I.bord2}}/>
      <span style={{width:6, height:6, transform:'rotate(45deg)', background:I.gold}}/>
      <span style={{width:48, height:1, background:I.bord2}}/>
    </div>
  );
  return (
    <div style={{minHeight:'100vh', background:I.bg, color:I.ink}}>
      <Header title="Choix mystère" onBack={()=>setView('home')}/>
      <div style={{...sans, textAlign:'center', padding:'clamp(40px,8vh,72px) 24px 120px', maxWidth:520, margin:'0 auto'}}>
        {!wine ? (
          <>
            <div style={{width:120, height:120, margin:'0 auto 26px', borderRadius:'50%', border:'1px solid ' + I.bord2, background:I.cream, display:'flex', alignItems:'center', justifyContent:'center', animation:'float 4s ease-in-out infinite'}}>
              <span style={{...serif, fontSize:60, color:I.wine, fontWeight:500, lineHeight:1}}>?</span>
            </div>
            <div style={capsIv(11, I.gold, {letterSpacing:'.3em', fontWeight:600})}>Laissez-vous surprendre</div>
            <h2 style={{...serif, fontSize:'clamp(2.4rem,7vw,3.2rem)', fontWeight:500, color:I.wine, margin:'10px 0 0', lineHeight:1.05}}>Choix mystère</h2>
            <Losange/>
            <p style={{color:I.body, margin:'0 auto 34px', lineHeight:1.7, fontSize:16, maxWidth:400}}>Un vin de notre rayon, tiré au sort entre 8 et 30 €, pour sortir de vos habitudes.</p>
            <button onClick={reveal} style={{...sans, minHeight:58, padding:'0 40px', background:I.wine, color:I.bg, border:'none', borderRadius:999, fontSize:16, fontWeight:500, letterSpacing:'.03em', cursor:'pointer', boxShadow:'0 18px 40px rgba(94,22,34,.16)'}}>Révéler le vin</button>
          </>
        ) : (
          <div>
            <div style={capsIv(11, I.gold, {letterSpacing:'.3em', fontWeight:600})}>Le sommelier a tiré</div>
            <h2 style={{...serif, fontSize:'clamp(2rem,6vw,2.6rem)', fontWeight:500, color:I.wine, margin:'10px 0 0'}}>Votre vin du moment</h2>
            <Losange/>
            <div style={{display:'flex', justifyContent:'center', marginBottom:20}}>
              <WineCard wine={wine} owned={collector.collection[wine.id]||0}/>
            </div>
            <div style={{fontSize:13, color:I.muted, marginBottom:18}}>Touchez la carte pour la retourner</div>
            {wine.emplacement && <div style={{display:'flex', justifyContent:'center', marginBottom:20}}><EmplacementVin wine={wine} grand={true}/></div>}
            <div style={{display:'flex', gap:10, justifyContent:'center', flexWrap:'wrap'}}>
              {FONCTIONS_CLIENT.maCave && <button onClick={()=>{ if (!enCave) { collector.addWine(wine.id); setAdded(true); } }}
                style={{...sans, minHeight:52, padding:'0 26px', background:enCave ? I.soft : I.wine, color:enCave ? I.wine : I.bg, border:'1px solid ' + (enCave ? I.bord2 : I.wine), borderRadius:999, fontSize:14, fontWeight:500, cursor:enCave ? 'default' : 'pointer'}}>
                {added ? '✓ Ajouté à ma cave' : enCave ? '✓ Dans ma cave' : 'Garder dans ma cave'}
              </button>}
              <button onClick={reveal} style={{...sans, minHeight:52, padding:'0 26px', background:'transparent', color:I.wine, border:'1px solid ' + I.bord2, borderRadius:999, fontSize:14, cursor:'pointer'}}>Une autre suggestion</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── CHAT ──────────────────────────────────────────────────────────────────────
function Chat({setView, collector, customer}) {
  // RGPD : aucun nom/identifiant client dans les messages (ils sont transmis à l'API IA)
  const initMsg = {role:'assistant', text:(customer?"Bonjour, ravi de vous revoir.":"Bonjour, je suis le sommelier de votre magasin.")+"\n\nDites-moi ce que vous préparez, votre budget ou vos goûts : je vous propose trois vins de notre rayon.", wines:[]};
  // Prompt enrichi avec les goûts du client connecté (notes de sa collection)
  const persoPrompt = useMemo(()=>{
    if (!customer) return SYS_PROMPT;
    const r = customer.ratings || {};
    const liked = Object.entries(r).filter(([,s])=>s>=4).map(([id])=>WINES.find(w=>w.id===parseInt(id))).filter(Boolean);
    const disliked = Object.entries(r).filter(([,s])=>s<=2).map(([id])=>WINES.find(w=>w.id===parseInt(id))).filter(Boolean);
    // Pseudonymisé : seules les préférences gustatives sont transmises, jamais l'identité
    let ctx = "\n\nPROFIL GUSTATIF DU CLIENT (anonyme) :";
    if (liked.length) ctx += "\nVins notés positivement (4-5 étoiles) : " + liked.map(w=>w.name+" ("+w.type+", "+w.region+", "+(w.grape||'')+")").join(" ; ") + ". Appuie-toi sur ces goûts (cépages, régions, styles) pour orienter tes recommandations et mentionne-le subtilement.";
    if (disliked.length) ctx += "\nVins peu appréciés (1-2 étoiles) : " + disliked.map(w=>w.name+" ("+w.type+", "+w.region+")").join(" ; ") + ". Évite de proposer ces vins ou des profils très similaires.";
    if (!liked.length && !disliked.length) ctx += "\nPas encore de notes enregistrées : invite-le subtilement à noter ses vins dans sa collection.";
    return SYS_PROMPT + ctx;
  }, [customer]);
  const [msgs,    setMsgs]    = useState([initMsg]);
  const [input,   setInput]   = useState('');
  const [loading, setLoading] = useState(false);
  const [modal,   setModal]   = useState(null);
  const [added,   setAdded]   = useState(null);
  const bottomRef = useRef(null);
  const {mic, toggle, speak, transcript} = useMic((text, isVoice) => send(text, isVoice));

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'});},[msgs,loading]);

  const send = async (txt, isVoice=false) => {
    const text = (txt||input).trim();
    if (!text||loading) return;
    setInput('');
    const newMsgs = [...msgs, {role:'user',text,wines:[]}];
    setMsgs(newMsgs);
    setLoading(true);
    const history = newMsgs.map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text}));
    const resp = await askSommelier(history, persoPrompt);
    setMsgs(m=>[...m,{role:'assistant',text:resp.text,wines:resp.wines||[]}]);
    setLoading(false);
    if (isVoice&&resp) speak(resp.text);
  };

  const handleCollect = wine => { collector.addWine(wine.id); setAdded(wine.id); setTimeout(()=>setAdded(null),2500); };
  const enCave = w => added===w.id || ((collector.collection||{})[w.id]||0) > 0;
  const labels = ['Sélection accessible','Au cœur du budget','Montée en gamme'];
  // Direction « Ivoire épuré » : mêmes fonctions, nouvel habillage.
  const I = C_IVOIRE;
  const sans = {fontFamily:'Montserrat,sans-serif'};
  const suggestions = ['Un vin pour un poulet rôti', 'Un blanc sec autour de 12 €', 'Une bouteille à offrir', 'Quel vin avec une raclette ?'];
  const IconeMicro = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>;
  const IconeValider = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>;
  const IconeSon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>;
  const IconeEnvoyer = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
  const peutEnvoyer = !!input.trim() && !loading;

  return (
    <div style={{display:'flex', flexDirection:'column', height:'calc(100vh - 34px)', background:I.bg, color:I.ink}}>
      <style>{'@keyframes pulseIv{0%,100%{box-shadow:0 0 0 0 rgba(94,22,34,.35)}50%{box-shadow:0 0 0 10px rgba(94,22,34,0)}}@keyframes pointIv{0%,80%,100%{opacity:.25}40%{opacity:1}}'}</style>
      <EnteteIvoire onBack={()=>setView('home')}/>

      <div style={{flex:1, overflowY:'auto'}}>
        <div style={{maxWidth:680, margin:'0 auto', padding:'28px 20px 20px', display:'flex', flexDirection:'column', gap:18}}>
          <div style={{textAlign:'center', marginBottom:4}}>
            <div style={capsIv(11, I.gold, {letterSpacing:'.3em', fontWeight:600, marginBottom:8})}>Conversation</div>
            <div style={{...serif, fontSize:34, fontWeight:500, color:I.wine, lineHeight:1.05}}>Votre sommelier</div>
          </div>

          {msgs.map((m,i)=>(
            <div key={i} style={{display:'flex', flexDirection:'column', alignItems:m.role==='user'?'flex-end':'flex-start'}}>
              {m.role==='assistant' && <div style={capsIv(10, I.muted, {letterSpacing:'.2em', fontWeight:600, margin:'0 0 7px 4px'})}>Le sommelier</div>}
              <div style={{...sans, maxWidth:'86%', background:m.role==='user'?I.wine:I.cream, color:m.role==='user'?I.bg:I.body, border:m.role==='user'?'none':'1px solid ' + I.bord, borderRadius:m.role==='user'?'20px 20px 6px 20px':'6px 20px 20px 20px', padding:'14px 18px', fontSize:16, lineHeight:1.65, whiteSpace:'pre-wrap'}}>
                {m.role==='assistant' ? m.text.replace(/^(?:🥇|⭐|✨)\uFE0F?\s*/gmu, '') : m.text}
              </div>

              {m.wines && m.wines.length>0 && (
                <div style={{width:'100%', marginTop:12, display:'flex', flexDirection:'column', gap:10}}>
                  {m.wines.map((w,wi)=>(
                    <div key={w.id} style={{background:I.cream, border:'1px solid ' + I.bord, borderRadius:18, overflow:'hidden'}}>
                      <div onClick={()=>setModal(w)} style={{display:'flex', gap:16, alignItems:'center', padding:'16px 18px', cursor:'pointer'}}>
                        <div style={{width:56, flexShrink:0, display:'flex', justifyContent:'center'}}><PhotoVin wine={w} h={78}/></div>
                        <div style={{flex:1, minWidth:0}}>
                          <div style={capsIv(10, I.gold, {letterSpacing:'.18em', fontWeight:600, marginBottom:5})}>{labels[wi]||''}</div>
                          {surtitreVin(w) && <div style={capsIv(10, I.muted, {letterSpacing:'.14em', marginBottom:2})}>{surtitreVin(w)}</div>}
                          <div style={{...serif, fontSize:22, fontWeight:600, color:I.ink, lineHeight:1.15}}>{nomVin(w)}{w.millesime && !detailsVin(w).includes(String(w.millesime)) ? ' ' + w.millesime : ''}</div>
                          <div style={{...sans, fontSize:13, color:I.muted, marginTop:4, lineHeight:1.5}}>{detailsVin(w)}</div>
                        </div>
                        <div style={{...serif, fontSize:26, fontWeight:600, color:I.wine, flexShrink:0}}>{w.price + ' €'}</div>
                      </div>
                      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, flexWrap:'wrap', padding:'12px 18px', borderTop:'1px solid ' + I.bord, background:I.bg}}>
                        <EmplacementVin wine={w}/>
                        {FONCTIONS_CLIENT.maCave && <button onClick={()=>handleCollect(w)}
                          style={{...sans, minHeight:44, padding:'0 18px', background:enCave(w)?I.soft:'transparent', border:'1px solid ' + (enCave(w)?I.bord2:I.wine), borderRadius:999, color:I.wine, fontSize:13, fontWeight:500, cursor:'pointer', whiteSpace:'nowrap'}}>
                          {added===w.id ? '✓ Ajouté à ma cave' : enCave(w) ? '✓ Dans ma cave' : 'Garder dans ma cave'}
                        </button>}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}

          {msgs.length===1 && !loading && (
            <div style={{display:'flex', flexWrap:'wrap', gap:10, marginTop:2}}>
              {suggestions.map(s=>(
                <button key={s} onClick={()=>send(s)}
                  style={{...sans, minHeight:48, padding:'0 18px', background:'transparent', border:'1px solid ' + I.bord2, borderRadius:999, color:I.ink, fontSize:14, cursor:'pointer'}}>{s}</button>
              ))}
            </div>
          )}

          {loading && (
            <div style={{alignSelf:'flex-start', display:'flex', alignItems:'center', gap:10, padding:'4px 4px'}}>
              <span style={{display:'flex', gap:5}}>
                {[0,1,2].map(k=><span key={k} style={{width:7, height:7, borderRadius:'50%', background:I.wine, animation:'pointIv 1.4s ease-in-out ' + (k*0.2) + 's infinite'}}/>)}
              </span>
              <span style={{...serif, fontStyle:'italic', fontSize:18, color:I.muted}}>Le sommelier réfléchit…</span>
            </div>
          )}
          <div ref={bottomRef}/>
        </div>
      </div>

      {(mic==='listening'||mic==='speaking') && (
        <div style={{...sans, textAlign:'center', fontSize:14, padding:'10px 16px', color:I.wine, flexShrink:0, background:I.soft, borderTop:'1px solid ' + I.bord}}>
          {mic==='listening'
            ? <span>{transcript ? <b style={{fontWeight:600}}>{transcript}</b> : 'Parlez… touchez à nouveau le micro pour envoyer'}</span>
            : <span>Le sommelier parle… <button onClick={()=>{speechSynthesis.cancel();}} style={{...sans, marginLeft:10, minHeight:36, background:'transparent', border:'1px solid ' + I.bord2, borderRadius:999, padding:'0 14px', fontSize:12, cursor:'pointer', color:I.wine}}>Arrêter</button></span>}
        </div>
      )}

      <div style={{flexShrink:0, borderTop:'1px solid ' + I.bord, background:I.cream}}>
        <div style={{maxWidth:680, margin:'0 auto', display:'flex', gap:10, padding:'14px 20px', alignItems:'center'}}>
          <button onClick={toggle} aria-label={mic==='listening' ? 'Envoyer la dictée' : 'Parler au sommelier'}
            style={{width:54, height:54, borderRadius:'50%', border:'1px solid ' + (mic==='off' ? I.bord2 : I.wine), cursor:'pointer', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', background:mic==='listening' ? I.wine : mic==='speaking' ? I.soft : I.cream, color:mic==='listening' ? I.bg : I.wine, animation:mic==='listening' ? 'pulseIv 1.6s ease-in-out infinite' : 'none'}}>
            {mic==='listening' ? <IconeValider/> : mic==='speaking' ? <IconeSon/> : <IconeMicro/>}
          </button>
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Écrivez ou parlez au sommelier…"
            style={{...sans, flex:1, minWidth:0, minHeight:54, background:I.bg, border:'1px solid ' + I.bord2, color:I.ink, borderRadius:999, padding:'0 20px', fontSize:16, outline:'none'}}/>
          <button onClick={()=>send()} disabled={!peutEnvoyer} aria-label="Envoyer"
            style={{width:54, height:54, borderRadius:'50%', border:'none', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', background:peutEnvoyer ? I.wine : I.bord, color:I.bg, cursor:peutEnvoyer ? 'pointer' : 'default', transition:'background .3s'}}>
            <IconeEnvoyer/>
          </button>
        </div>
      </div>
      {modal&&<WineModal wine={modal} onClose={()=>setModal(null)} onCollect={FONCTIONS_CLIENT.maCave ? ()=>{handleCollect(modal);setModal(null);} : null}/>}
    </div>
  );
}
