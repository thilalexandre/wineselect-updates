// Application des stocks/prix importés via CSV (admin)
try {
  const ov = JSON.parse(localStorage.getItem('ws_stock_overrides')||'[]');
  ov.forEach(o=>{ const w=WINES.find(x=>x.id===o.id); if(w){
    if(typeof o.stock==='number'&&!isNaN(o.stock)) w.stock=o.stock;
    if(typeof o.price==='number'&&!isNaN(o.price)) w.price=o.price;
    if(typeof o.featured==='boolean') w.featured=o.featured;
    if(typeof o.featuredReason==='string') w.featuredReason=o.featuredReason;
  } });
} catch(e) {}
// Cohérence budget/prix : la tranche affichée découle TOUJOURS du prix réel,
// pour que la sélection guidée ne propose jamais un vin hors du budget choisi.
const budgetForPrice = p => p<=8 ? '-8' : p<=15 ? '8-15' : p<=25 ? '15-25' : '25+';
WINES.forEach(w=>{ w.budget = budgetForPrice(w.price); });

// Le PIN admin n'est plus stocké dans ce fichier — il est vérifié côté
// serveur (route /api/admin-auth), pour ne plus être lisible en clair via
// F12 (Inspecter / Sources). Voir admin-pin.txt côté serveur.js.

function AdminGate({ children, setView }) {
  const [pin, setPin] = React.useState('');
  const [unlocked, setUnlocked] = React.useState(false);
  const [error, setError] = React.useState(false);
  const [checking, setChecking] = React.useState(false);

  if (unlocked) return children;

  const submit = async () => {
    if (checking) return;
    setChecking(true);
    try {
      const res = await fetch('/api/admin-auth', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ pin }),
      });
      const data = await res.json();
      if (data.ok) {
        ADMIN_TOKEN = data.token || null;
        setUnlocked(true);
      } else {
        setError(data.error || true);
        setPin('');
        setTimeout(() => setError(false), 1500);
      }
    } catch (e) {
      setError('Connexion au serveur impossible');
      setTimeout(() => setError(false), 1500);
    } finally {
      setChecking(false);
    }
  };

  return (
    <div style={{maxWidth:340, margin:'80px auto', padding:24, textAlign:'center'}}>
      <div style={{fontSize:34, marginBottom:8}}>🔒</div>
      <div style={{fontFamily:"'Cormorant Garamond',serif", fontSize:22, color:'#5e1622', fontWeight:700, marginBottom:6}}>Accès gérant</div>
      <div style={{fontSize:12, color:'#8a6a5c', marginBottom:18}}>Entrez le code PIN pour accéder à l'administration.</div>
      <input
        type="password"
        inputMode="numeric"
        value={pin}
        onChange={e => setPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
        onKeyDown={e => { if (e.key === 'Enter') submit(); }}
        style={{width:'100%', padding:'12px 14px', fontSize:20, letterSpacing:'0.3em', textAlign:'center', border:'1px solid ' + (error ? '#c0392b' : 'rgba(176,141,79,.30)'), borderRadius:10, marginBottom:14, fontFamily:'Montserrat,sans-serif', boxSizing:'border-box'}}
        placeholder="••••"
        autoFocus
      />
      {error && <div style={{color:'#c0392b', fontSize:12, marginBottom:10}}>{typeof error === 'string' ? error : 'Code incorrect'}</div>}
      <button onClick={submit} disabled={checking} style={{width:'100%', padding:'12px', background:'#5e1622', color:'#fff', border:'none', borderRadius:10, fontSize:14, fontWeight:600, cursor:checking?'default':'pointer', opacity:checking?0.7:1, marginBottom:10}}>{checking?'Vérification...':'Valider'}</button>
      <button onClick={() => setView('home')} style={{width:'100%', padding:'10px', background:'transparent', color:'#8a6a5c', border:'none', fontSize:12, cursor:'pointer'}}>Retour</button>
    </div>
  );
}

function shapeFor(wine){
  if (wine.type === 'bulles') return 'champagne';
  const t = ((wine.region||'')+' '+(wine.appellation||'')+' '+(wine.name||'')).toLowerCase();
  let s = 'bordeaux';
  if (/alsace|savoie|allemagne|riesling|gew[uü]rz|sylvaner|pinot gris|moselle/.test(t)) s = 'flute';
  else if (/provence|corse/.test(t)) s = (wine.type === 'rosé') ? 'provence' : 'burgundy';
  else if (/bourgogne|beaujolais|rh[ôo]ne|jura|bugey|chablis|m[âa]con|mercurey|givry|loire|auvergne|sancerre|pouilly|vouvray|muscadet|anjou|saumur|chinon|touraine|quincy|menetou|ch[âa]teauneuf|gigondas|vacqueyras|cairanne|rasteau|crozes|hermitage|c[ôo]te[- ]r[ôo]tie|cornas|saint-joseph|condrieu|ventoux|luberon|tavel|lirac|morgon|fleurie|brouilly|juli[ée]nas|chiroubles|moulin-[àa]-vent/.test(t)) s = 'burgundy';
  if (wine.type === 'rosé' && s === 'bordeaux') s = 'provence';
  return s;
}

function filterWines(type, budget, pairing) {
  let results = WINES.filter(w =>
    (!type    || w.type === type) &&
    (!budget  || w.budget === budget) &&
    (!pairing || (w.pairings||[]).includes(pairing))
  );

  if (budget === '25+') {
    // Tranche sans plafond : 3 paliers progressifs (accessible ~35€ /
    // milieu ~55€ / haut de gamme ~100€) pour ne jamais proposer d'entrée
    // un grand cru très cher a un client qui a juste dit "plus de 25€".
    const tiers = [
      { max: 40, target: 35 },
      { max: 70, target: 55 },
      { max: Infinity, target: 100 },
    ];
    const rankOf = price => tiers.findIndex(t => price <= t.max);
    const used = new Set();
    const ladder = [];
    tiers.forEach((t, i) => {
      const pool = results.filter(w => rankOf(w.price) === i && !used.has(w.id));
      pool.sort((a, b) => {
        const da = Math.abs(a.price - t.target), db = Math.abs(b.price - t.target);
        if (Math.abs(da - db) > 5) return da - db;
        return b.rating - a.rating;
      });
      if (pool.length) { ladder.push(pool[0]); used.add(pool[0].id); }
    });
    const rest = results.filter(w => !used.has(w.id))
      .sort((a, b) => (a.price - b.price) || (b.rating - a.rating));
    results = [...ladder, ...rest];
  } else {
    // Sort by price DESC first (push towards top of budget range), then by rating
    results.sort((a, b) => {
      if (Math.abs(a.price - b.price) > 3) return b.price - a.price;
      return b.rating - a.rating;
    });
  }

  return results;
}

// Sauvegarde de secours vers le serveur : best-effort, jamais bloquant.
// Si le serveur ne répond pas (borne hors ligne, etc.), l'app continue de
// fonctionner normalement avec localStorage — c'est juste la copie de
// sûreté qui manquera pour cette sauvegarde.
function syncToServer(endpoint, data){
  try{
    fetch('/api/' + endpoint, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data),
    }).catch(()=>{});
  }catch(e){}
}

// Token de session admin — obtenu après validation du PIN (/api/admin-auth),
// requis par le serveur pour écrire sur les routes admin-only (stock-overrides).
// Variable de module (pas de state React) : accessible depuis AdminGate et
// depuis Admin sans avoir à la faire transiter en props.
let ADMIN_TOKEN = null;

// Comme syncToServer, mais réservé aux écritures admin-only (import CSV,
// mise en avant). Best-effort comme le reste des sync : si le token a
// expiré, le serveur refuse (401) et on log sans bloquer l'UI — l'admin
// reverra l'écran PIN à sa prochaine ouverture d'Admin.
function syncToServerAdmin(endpoint, data){
  try{
    fetch('/api/' + endpoint, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'X-Admin-Token': ADMIN_TOKEN || ''},
      body: JSON.stringify(data),
    }).then(r=>{ if(r.status===401){ ADMIN_TOKEN=null; console.warn('Session admin expirée — reconnexion nécessaire.'); } }).catch(()=>{});
  }catch(e){}
}
function loadProfiles(){ try{ return JSON.parse(localStorage.getItem('ws_profiles')||'{}'); }catch(e){ return {}; } }
function saveProfiles(p){ try{ localStorage.setItem('ws_profiles', JSON.stringify(p)); }catch(e){} syncToServer('profiles', p); }
function loadGlobalRatings(){ try{ return JSON.parse(localStorage.getItem('ws_global_ratings')||'{}'); }catch(e){ return {}; } }
function saveGlobalRatings(r){ try{ localStorage.setItem('ws_global_ratings', JSON.stringify(r)); }catch(e){} syncToServer('global-ratings', r); }

// Restauration manuelle depuis le serveur (Admin > Config). Utile si le
// cache du navigateur a été vidé ou si la borne a été réinstallée : les
// dernières données sauvegardées côté serveur remplacent le localStorage.
async function restoreFromServer(){
  const [profiles, ratings, stock] = await Promise.all([
    fetch('/api/profiles').then(r=>r.json()).catch(()=>null),
    fetch('/api/global-ratings').then(r=>r.json()).catch(()=>null),
    fetch('/api/stock-overrides').then(r=>r.json()).catch(()=>null),
  ]);
  if(profiles) localStorage.setItem('ws_profiles', JSON.stringify(profiles));
  if(ratings) localStorage.setItem('ws_global_ratings', JSON.stringify(ratings));
  if(stock) localStorage.setItem('ws_stock_overrides', JSON.stringify(stock));
  return {profiles:!!profiles, ratings:!!ratings, stock:!!stock};
}

function useCustomer(){
  const [customer, setCustomer] = useState(()=>{
    try{ const id=localStorage.getItem('ws_current_customer'); if(!id) return null; return loadProfiles()[id]||null; }catch(e){ return null; }
  });
  const login = useCallback((cardId)=>{
    const id=(cardId||'').trim(); if(!id) return null;
    const profiles=loadProfiles();
    let prof=profiles[id];
    const isNew=!prof;
    if(!prof){ prof={id:id, name:'Client '+id.slice(-4).toUpperCase(), collection:{}, ratings:{}, createdAt:Date.now()}; }
    prof.lastVisit=Date.now();
    profiles[id]=prof; saveProfiles(profiles);
    try{ localStorage.setItem('ws_current_customer', id); }catch(e){}
    setCustomer({...prof});
    return {profile:prof, isNew:isNew};
  },[]);
  const logout = useCallback(()=>{ try{ localStorage.removeItem('ws_current_customer'); }catch(e){} setCustomer(null); },[]);
  // RGPD : droit à l'effacement — supprime intégralement le profil de la borne
  const erase = useCallback(()=>{
    setCustomer(prev=>{ if(prev){ const p=loadProfiles(); delete p[prev.id]; saveProfiles(p); } return null; });
    try{ localStorage.removeItem('ws_current_customer'); }catch(e){}
  },[]);
  const update = useCallback((fn)=>{
    setCustomer(prev=>{
      if(!prev) return prev;
      const next=fn({...prev});
      const profiles=loadProfiles(); profiles[next.id]=next; saveProfiles(profiles);
      return next;
    });
  },[]);
  return {customer:customer, login:login, logout:logout, update:update, erase:erase};
}

// ── COLLECTOR ─────────────────────────────────────────────────────────────────
function useCollector(customerApi) {
  const customer = customerApi ? customerApi.customer : null;
  const [anonCol, setAnonCol] = useState(() => {
    try { return JSON.parse(localStorage.getItem('ws_col') || '{}'); } catch { return {}; }
  });
  const collection = customer ? (customer.collection||{}) : anonCol;
  const addWine = useCallback((wineId) => {
    if (customer && customerApi) {
      customerApi.update(p=>({...p, collection:{...(p.collection||{}), [wineId]:((p.collection||{})[wineId]||0)+1}}));
    } else {
      setAnonCol(prev => {
        const next = {...prev, [wineId]: (prev[wineId]||0)+1};
        try{ localStorage.setItem('ws_col', JSON.stringify(next)); }catch(e){}
        return next;
      });
    }
  }, [customer, customerApi]);
  // Notation d'un vin par le client (1 à 5 étoiles) + agrégat global pour l'admin
  const rateWine = useCallback((wineId, stars) => {
    if (!customerApi || !customer) return;
    const prevStars = (customer.ratings||{})[wineId] || 0;
    customerApi.update(p=>({...p, ratings:{...(p.ratings||{}), [wineId]:stars}}));
    const g = loadGlobalRatings();
    const e = g[wineId] || {sum:0, count:0};
    if (prevStars>0) { e.sum = e.sum - prevStars + stars; }
    else { e.sum += stars; e.count += 1; }
    g[wineId] = e; saveGlobalRatings(g);
  }, [customer, customerApi]);
  const ratings = customer ? (customer.ratings||{}) : {};
  const totalCards = Object.keys(collection).length;
  const points = totalCards * 10;
  return {collection, addWine, totalCards, points, rateWine, ratings, customer};
}

let recog = null;
let recogTranscript = '';

function useMic(onResult) {
  const [mic,        setMic]        = useState('off');
  const [transcript, setTranscript] = useState('');

  const startListening = () => {
    speechSynthesis.cancel();
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Micro non supporté — utilisez Chrome'); return; }
    recog = new SR();
    recog.lang = 'fr-FR';
    recog.continuous     = true;
    recog.interimResults = true;
    recogTranscript = '';

    recog.onstart  = () => { setMic('listening'); setTranscript(''); };

    recog.onresult = e => {
      let interim = '';
      let final   = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t + ' ';
        else interim += t;
      }
      recogTranscript += final;
      setTranscript((recogTranscript + interim).trim());
    };

    recog.onerror = e => {
      if (e.error !== 'no-speech') { setMic('off'); setTranscript(''); }
    };

    recog.start();
  };

  const validate = () => {
    if (recog) { try { recog.stop(); } catch(e) {} recog = null; }
    const text = (recogTranscript || transcript).trim();
    setMic('off'); setTranscript(''); recogTranscript = '';
    if (text) onResult(text, true);
  };

  const toggle = () => {
    if (mic === 'speaking')  { speechSynthesis.cancel(); setMic('off'); return; }
    if (mic === 'listening') { validate(); return; }
    startListening();
  };

  const speak = text => {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n+/g, '. ').trim());
    u.lang = 'fr-FR'; u.rate = 0.93;
    const fr = speechSynthesis.getVoices().find(v => v.lang.startsWith('fr'));
    if (fr) u.voice = fr;
    u.onstart = () => setMic('speaking');
    u.onend   = () => setMic('off');
    speechSynthesis.speak(u);
  };

  return {mic, toggle, speak, transcript};
}

async function askGabriel(history, system) {
  try {
    const res = await fetch('http://localhost:3000/sommelier', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({system: system || SYS_PROMPT, messages: history, featuredIds: WINES.filter(w=>w.featured).map(w=>w.id)})
    });
    if (!res.ok) throw new Error('api');
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    const full = d.text;
    const m = full.match(/\[WINES:([\d,\s]+)\]/);
    const wines = m ? m[1].split(',').map(id=>WINES.find(w=>w.id===parseInt(id.trim()))).filter(Boolean) : [];

// ── Conversion des nombres en toutes lettres (dictée vocale) ────────────────
const FR_UNITS = {zero:0,un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,
  dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16};
const FR_TENS  = {vingt:20,trente:30,quarante:40,cinquante:50,soixante:60,septante:70,octante:80,nonante:90};
const FR_NUM_WORDS = Object.keys(FR_UNITS).concat(Object.keys(FR_TENS), ['cent','cents','mille']);
const FR_NUM_RE = new RegExp('\\b(?:' + FR_NUM_WORDS.join('|') + ')(?:[\\s-]+(?:' + FR_NUM_WORDS.join('|') + '))*\\b', 'gi');

function frenchWordsToNumber(phrase) {
  const words = phrase.toLowerCase().replace(/-/g, ' ').split(/\s+/).filter(w => w && w !== 'et');
  let result = 0, group = 0;
  for (const w of words) {
    if (w in FR_UNITS) group += FR_UNITS[w];
    else if (w in FR_TENS) { if (w === 'vingt' && group >= 2 && group <= 9) group = group * 20; else group += FR_TENS[w]; }
    else if (w === 'cent' || w === 'cents') { group = (group === 0 ? 1 : group) * 100; result += group; group = 0; }
    else if (w === 'mille') { group = (group === 0 ? 1 : group) * 1000; result += group; group = 0; }
  }
  return result + group;
}

function normalizeFrenchNumbers(text) {
  const merged = text.replace(/\b(vingt|trente|quarante|cinquante|soixante)\s+et\s+(un|une|onze)\b/gi, '$1-$2');
  return merged.replace(FR_NUM_RE, (match) => { const n = frenchWordsToNumber(match); return isNaN(n) ? match : String(n); });
}

function localFallback(msg) {
  const m = normalizeFrenchNumbers(msg.toLowerCase());
  let maxP = null, minP = 0;

  const range = m.match(/entre\s*(\d+)\s*(?:et|à|-)\s*(\d+)/);
  const floorOpen = m.match(/(\d+)\s*(?:€|euros?)?\s*(?:et\s+plus|ou\s+plus)/) || m.match(/(?:à\s+partir\s+de|au\s+moins|minimum)\s*(?:de)?\s*(\d+)/);
  const capped = m.match(/(?:moins\s+de|pas\s+plus\s+de|max(?:imum)?\s*(?:de)?)\s*(\d+)/);
  const exact  = m.match(/(\d+)\s*(?:€|euros?)/);

  if (range) { minP = parseInt(range[1]); maxP = parseInt(range[2]); }
  else if (floorOpen) { minP = parseInt(floorOpen[1]); maxP = minP * 3; }
  else if (capped) { maxP = parseInt(capped[1]); minP = Math.round(maxP*0.7); }
  else if (exact) { const p = parseInt(exact[1]); minP = Math.round(p*0.8); maxP = Math.round(p*1.2); }

  // Filet de sécurité : si aucun budget n'est détecté du tout, on plafonne
  // par défaut à une fourchette grand public, sauf intention premium explicite.
  const premiumIntent = /peu importe le prix|grande occasion|grand cru|prestige|meilleur vin|sans limite/.test(m);
  if (maxP === null && !premiumIntent) { maxP = 45; minP = 0; }

  let pool = WINES.filter(w => (maxP===null || w.price<=maxP) && w.price>=minP);
  if (!pool.length) pool = [...WINES].filter(w => maxP===null || w.price <= maxP*1.5);
  if (!pool.length) pool = [...WINES];

  if (/\brosé\b/.test(m)) pool=pool.filter(w=>w.type==='rosé');
  else if (/champagne|bulle|crémant/.test(m)) pool=pool.filter(w=>w.type==='bulles');
  else if (/\bblanc\b/.test(m)) pool=pool.filter(w=>w.type==='blanc');
  else if (/\brouge\b/.test(m)) pool=pool.filter(w=>w.type==='rouge');

  return {text:`Voici ma sélection${maxP?' autour de '+maxP+'€':''}. Retournez les cartes pour les détails !`, wines:pool.sort((a,b)=>b.rating-a.rating).slice(0,3)};
}

        onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,250,240,.7)';e.currentTarget.style.borderColor='rgba(176,141,79,.4)';}}

// ── SELECTION ─────────────────────────────────────────────────────────────────
function Selection({setView, setResults}) {
  const [step, setStep]       = useState(1);
  const [type, setType]       = useState(null);
  const [budget, setBudget]   = useState(null);
  const [pairing, setPairing] = useState(null);
  const [awaitingDetail, setAwaitingDetail] = useState(false);
  const [thinking, setThinking] = useState(false);
  const count = filterWines(type, budget, null).length;
  const pairingOpts = PAIRINGS.filter(p=>(PTY[type]||PAIRINGS.map(x=>x.id)).includes(p.id));
  const stepLabels = ['Type de vin','Budget','Accord mets-vins'];

  // Repli local si le serveur ne répond pas — même logique de secours
  // qu'avant, pour ne jamais laisser le client sans résultat.
  // Rôles assignés par heuristique (miroir du repli serveur) : le mieux noté
  // des trois = valeur sûre, les 2 autres = coup de cœur / découverte — jamais
  // par position, pour rester cohérent avec le mode normal (réponse Gabriel).
  const withFallbackRoles = wines => {
    if (wines.length < 3) return wines;
    const byRating = [...wines].sort((a,b)=>b.rating-a.rating);
    const roles = { [byRating[0].id]: 'valeur_sure' };
    const rest = wines.filter(w=>w.id!==byRating[0].id);
    roles[rest[0].id] = 'coup_de_coeur';
    roles[rest[1].id] = 'decouverte';
    return wines.map(w => ({...w, aiRole: roles[w.id]}));
  };

  const localFallback = p => {
    let r = filterWines(type, budget, p).slice(0,3);
    if (r.length<3) { const e=filterWines(type,budget,null).filter(w=>!r.find(x=>x.id===w.id)); r=[...r,...e].slice(0,3); }
    if (r.length<3) { const e=filterWines(type,null,null).filter(w=>!r.find(x=>x.id===w.id));   r=[...r,...e].slice(0,3); }
    return withFallbackRoles(r);
  };

  const pickType = t => { setType(t); setStep(2); };
  const pickBudget = b => { setBudget(b); setStep(3); };

  const choosePairing = p => {
    setPairing(p);
    if (PAIRING_DETAILS[p]) setAwaitingDetail(true);
    else runSelection(p, null);
  };

  const runSelection = async (p, detail) => {
    setAwaitingDetail(false);
    setThinking(true);
    try {
      const res = await fetch('http://localhost:3000/selection-accord', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({type, budget, pairing:p, detail, featuredIds: WINES.filter(w=>w.featured).map(w=>w.id)})
      });
      if (!res.ok) throw new Error('api');
      const d = await res.json();
      if (d.error || !Array.isArray(d.ids)) throw new Error(d.error||'réponse invalide');
      let r = d.ids.map(id => WINES.find(w=>w.id===id)).filter(Boolean);
      if (r.length<3) r = localFallback(p);
      else if (d.roles && r.every(w=>d.roles[w.id])) {
        r = r.map(w => ({...w, aiReason: (d.reasons||{})[w.id], aiRole: d.roles[w.id]}));
      } else {
        // Rôles absents/incomplets (ancien serveur, ou repli sans IA côté serveur) → heuristique locale.
        r = withFallbackRoles(r).map(w => ({...w, aiReason: (d.reasons||{})[w.id]}));
      }
      setResults(r); setView('results');
    } catch(e) {
      setResults(localFallback(p)); setView('results');
    } finally {
      setThinking(false);
    }
  };

  return (
    <div style={{minHeight:'100vh', background:C.bg}}>
      <Header title="Sélection guidée" subtitle={'Étape '+step+'/3 — '+(awaitingDetail?'Précisez':stepLabels[step-1])}
        onBack={()=>awaitingDetail?setAwaitingDetail(false):(step>1?setStep(step-1):setView('home'))}
        right={<div style={{background:'rgba(107,31,42,.08)', border:'1px solid '+C.bord, borderRadius:50, padding:'4px 12px', fontSize:12, color:C.wine}}>{count} vins</div>}/>
      <div style={{background:C.bg2, padding:'0 18px 12px', display:'flex', gap:4}}>
        {[1,2,3].map(i=><div key={i} style={{flex:1, height:3, borderRadius:2, background:step>=i?C.gold:'rgba(107,31,42,.15)', transition:'background .3s'}}/>)}
      </div>
      <div style={{maxWidth:520, margin:'0 auto', padding:'20px 16px'}}>
        {step===1 && (
          <div>
            <h2 style={{...serif, fontSize:'clamp(1.5rem,4vw,2rem)', color:C.wine, textAlign:'center', marginBottom:20}}>Quel type de vin vous attire ?</h2>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
              {TYPES.map(t=>(
                <div key={t.id} onClick={()=>pickType(t.id)} style={{background:t.bg, border:'2px solid '+(type===t.id?t.color:'transparent'), borderRadius:16, padding:'20px 14px', textAlign:'center', cursor:'pointer', transition:'all .25s', boxShadow:type===t.id?'0 4px 18px '+t.color+'33':'0 2px 8px rgba(107,31,42,.05)'}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=t.color;e.currentTarget.style.transform='translateY(-2px)';}}
                  onMouseLeave={e=>{if(type!==t.id){e.currentTarget.style.borderColor='transparent';e.currentTarget.style.transform='translateY(0)';}}}>
                  <div style={{marginBottom:8, display:'flex', justifyContent:'center'}}><TypeIcon id={t.id} color={t.color} size={38}/></div>
                  <div style={{...serif, fontSize:19, color:type===t.id?t.color:C.wine, fontWeight:700, marginBottom:4}}>{t.label}</div>
                  <div style={{fontSize:12, color:C.muted}}>{t.desc}</div>
                </div>
              ))}
            </div>
          </div>
        )}
        {step===2 && (
          <div>
            <h2 style={{...serif, fontSize:'clamp(1.5rem,4vw,2rem)', color:C.wine, textAlign:'center', marginBottom:20}}>Quel est votre budget ?</h2>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, maxWidth:420, margin:'0 auto'}}>
              {BUDGETS.map(b=>(
                <div key={b.id} onClick={()=>pickBudget(b.id)} style={{background:budget===b.id?'#fef9ed':C.cream, border:'2px solid '+(budget===b.id?C.gold:C.bord), borderRadius:14, padding:17, textAlign:'center', cursor:'pointer', transition:'all .25s'}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor=C.gold}
                  onMouseLeave={e=>{if(budget!==b.id)e.currentTarget.style.borderColor=C.bord;}}>
                  <div style={{...serif, fontSize:19, fontWeight:700, color:budget===b.id?C.light:C.wine, marginBottom:4}}>{b.label}</div>
                  <div style={{fontSize:12, color:C.muted}}>{b.desc}</div>
                </div>
              ))}
            </div>
          </div>
        )}
        {step===3 && !thinking && !awaitingDetail && (
          <div>
            <h2 style={{...serif, fontSize:'clamp(1.3rem,3.5vw,1.9rem)', color:C.wine, textAlign:'center', marginBottom:18}}>Avec quel plat ?</h2>
            <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:9}}>
              {pairingOpts.map(p=>(
                <div key={p.id} onClick={()=>choosePairing(p.id)} style={{background:PAIRING_BG[p.id]||C.cream, border:'1.5px solid '+C.bord, borderRadius:12, padding:'12px 6px', textAlign:'center', cursor:'pointer', transition:'all .2s'}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=PAIRING_COLORS[p.id]||C.gold;e.currentTarget.style.transform='scale(1.04)';}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bord;e.currentTarget.style.transform='scale(1)';}}>
                  <div style={{marginBottom:4, display:'flex', justifyContent:'center'}}><PairingIcon id={p.id} size={24}/></div>
                  <div style={{...serif, fontSize:12, color:C.wine}}>{p.label}</div>
                </div>
              ))}
            </div>
          </div>
        )}
        {step===3 && !thinking && awaitingDetail && (
          <div>
            <h2 style={{...serif, fontSize:'clamp(1.3rem,3.5vw,1.9rem)', color:C.wine, textAlign:'center', marginBottom:6}}>Une précision ?</h2>
            <div style={{textAlign:'center', fontSize:12, color:C.muted, marginBottom:18}}>Pour un accord plus juste — facultatif</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, maxWidth:440, margin:'0 auto'}}>
              {(PAIRING_DETAILS[pairing]||[]).map(d=>(
                <div key={d.id} onClick={()=>runSelection(pairing, d.label)} style={{background:C.cream, border:'1.5px solid '+C.bord, borderRadius:12, padding:'14px 10px', textAlign:'center', cursor:'pointer', transition:'all .2s'}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=C.gold;e.currentTarget.style.transform='scale(1.03)';}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bord;e.currentTarget.style.transform='scale(1)';}}>
                  <div style={{...serif, fontSize:14, color:C.wine}}>{d.label}</div>
                </div>
              ))}
              <div onClick={()=>runSelection(pairing, null)} style={{gridColumn:'1 / -1', background:'transparent', border:'1.5px dashed '+C.bord, borderRadius:12, padding:'12px 10px', textAlign:'center', cursor:'pointer', color:C.muted, fontSize:13, transition:'all .2s'}}
                onMouseEnter={e=>e.currentTarget.style.borderColor=C.gold}
                onMouseLeave={e=>e.currentTarget.style.borderColor=C.bord}>
                Peu importe, laissez Gabriel choisir
              </div>
            </div>
          </div>
        )}
        {step===3 && thinking && (
          <div style={{textAlign:'center', padding:'50px 20px'}}>
            <div style={{fontSize:42, marginBottom:14, animation:'pulse 1.4s ease-in-out infinite'}}>🍷</div>
            <div style={{...serif, fontSize:18, color:C.wine}}>Gabriel choisit vos vins...</div>
            <div style={{fontSize:12, color:C.muted, marginTop:6}}>Il compare cépages, régions et accords pour ce plat</div>
            <style>{'@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(1.08);}}'}</style>
          </div>
        )}
      </div>
    </div>
  );
}

// ── CHAT ──────────────────────────────────────────────────────────────────────
function Chat({setView, collector, customer}) {
  // RGPD : aucun nom/identifiant client dans les messages (ils sont transmis à l'API IA)
  const initMsg = {role:'assistant', text:(customer?"Bonjour, ravi de vous revoir ! 🍷":"Bonjour ! Je suis Gabriel, votre sommelier. 🍷")+"\n\nPosez-moi n'importe quelle question sur le vin — budget, accord, cépage, occasion...\nJe vous guide vers le vin parfait !", wines:[]};
  // Prompt enrichi avec les goûts du client connecté (notes de sa collection)
  const persoPrompt = useMemo(()=>{
    if (!customer) return SYS_PROMPT;
    const r = customer.ratings || {};
    const liked = Object.entries(r).filter(([,s])=>s>=4).map(([id])=>WINES.find(w=>w.id===parseInt(id))).filter(Boolean);
    const disliked = Object.entries(r).filter(([,s])=>s<=2).map(([id])=>WINES.find(w=>w.id===parseInt(id))).filter(Boolean);
    // Pseudonymisé : seules les préférences gustatives sont transmises, jamais l'identité
    let ctx = "\n\nPROFIL GUSTATIF DU CLIENT (anonyme) :";
    if (liked.length) ctx += "\nVins notés positivement (4-5 étoiles) : " + liked.map(w=>w.name+" ("+w.type+", "+w.region+", "+(w.grape||'')+")").join(" ; ") + ". Appuie-toi sur ces goûts (cépages, régions, styles) pour orienter tes recommandations et mentionne-le subtilement.";
    if (disliked.length) ctx += "\nVins peu appréciés (1-2 étoiles) : " + disliked.map(w=>w.name+" ("+w.type+", "+w.region+")").join(" ; ") + ". Évite de proposer ces vins ou des profils très similaires.";
    if (!liked.length && !disliked.length) ctx += "\nPas encore de notes enregistrées : invite-le subtilement à noter ses vins dans sa collection.";
    return SYS_PROMPT + ctx;
  }, [customer]);
  const [msgs,    setMsgs]    = useState([initMsg]);
  const [input,   setInput]   = useState('');
  const [loading, setLoading] = useState(false);
  const [modal,   setModal]   = useState(null);
  const [added,   setAdded]   = useState(null);
  const bottomRef = useRef(null);
  const {mic, toggle, speak, transcript} = useMic((text, isVoice) => send(text, isVoice));

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'});},[msgs,loading]);

  const send = async (txt, isVoice=false) => {
    const text = (txt||input).trim();
    if (!text||loading) return;
    setInput('');
    const newMsgs = [...msgs, {role:'user',text,wines:[]}];

    setLoading(true);
    const history = newMsgs.map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text}));

    setLoading(false);

              {m.role==='assistant'&&<span style={{fontSize:15,marginRight:5}}>🍷</span>}

            {m.wines&&m.wines.length>0&&(

                {m.wines.map((w,wi)=>(

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function Admin({setView}) {
  const [tab,          setTab]          = useState('dashboard');
  const [search,       setSearch]       = useState('');
  const [typeFilter,   setTypeFilter]   = useState('all');
  const [budgetFilter, setBudgetFilter] = useState('all');
  const [sortBy,       setSortBy]       = useState('rating');
  const [expanded,     setExpanded]     = useState(null);
  const [editWine,     setEditWine]     = useState(null);
  const [localWines,   setLocalWines]   = useState(WINES);
  const [notif,        setNotif]        = useState(null);

  const notify = (msg, type='success') => { setNotif({msg,type}); setTimeout(()=>setNotif(null),3000); };

  // ── Suggestions "surstock" ───────────────────────────────────────────────
  // Le stock brut n'est pas comparable entre tranches (un vin à 6€ a
  // structurellement bien plus de stock qu'un grand cru à 80€) : on compare
  // donc chaque vin à la moyenne de SA tranche budgétaire, pour repérer un
  // vrai surstock relatif plutôt que de ne remonter que les vins bon marché.
  const overstockSuggestions = useMemo(() => {
    const byBracket = {};
    localWines.forEach(w => { (byBracket[w.budget] ||= []).push(w.stock); });
    const avgOf = b => { const arr = byBracket[b]||[]; return arr.length ? arr.reduce((a,c)=>a+c,0)/arr.length : 0; };
    return localWines
      .filter(w => !w.featured && w.stock > avgOf(w.budget) * 1.4)
      .map(w => ({ w, excess: w.stock / (avgOf(w.budget) || 1) }))
      .sort((a,b) => b.excess - a.excess)
      .slice(0, 6)
      .map(x => x.w);
  }, [localWines]);

  const applySuggestion = w => {
    setLocalWines(p => { const next = p.map(x => x.id===w.id ? {...x, featured:true, featuredReason:'stock'} : x); persistOverrides(next); return next; });
    notify('"' + w.name + '" ajouté à la sélection');
  };

  // Persistance partagée (stock/prix/sélection) — appelée après chaque mutation
  // de localWines pour que ça survienne au reset d'inactivité (90s) et au
  // redémarrage de la borne, comme le fait déjà l'import CSV.
  const persistOverrides = wines => {
    try {
      const data = wines.map(w=>({id:w.id, stock:w.stock, price:w.price, featured:!!w.featured, featuredReason:w.featuredReason||null}));
      localStorage.setItem('ws_stock_overrides', JSON.stringify(data));
      syncToServerAdmin('stock-overrides', data);
    } catch(e) {}
  };

  const filtered = localWines.filter(w=>{
    if (typeFilter!=='all'&&w.type!==typeFilter) return false;
    if (budgetFilter!=='all'&&w.budget!==budgetFilter) return false;
    if (search){const s=search.toLowerCase();return w.name.toLowerCase().includes(s)||w.region.toLowerCase().includes(s)||(w.grape||'').toLowerCase().includes(s);}
    return true;
  }).sort((a,b)=>{
    if(sortBy==='rating')    return b.rating-a.rating;
    if(sortBy==='price_desc')return b.price-a.price;
    if(sortBy==='price_asc') return a.price-b.price;

  // Import de stock via fichier CSV (export Excel : id;nom;stock;prix ou id;stock)
  const handleCSVImport = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const text = String(ev.target.result||'');
        const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
        if (!lines.length) { notify('Fichier vide','error'); return; }
        const sep = lines[0].includes(';') ? ';' : (lines[0].includes('\t') ? '\t' : ',');
        let updated=0, priced=0;
        setLocalWines(prev=>{
          const next=[...prev];
          lines.forEach(line=>{
            const cols=line.split(sep).map(c=>c.trim().replace(/^"|"$/g,''));
            const id=parseInt(cols[0]); if(!id||isNaN(id)) return;
            const i=next.findIndex(w=>w.id===id); if(i<0) return;
            const w={...next[i]};
            const stockCol = cols.length>=3 ? cols[2] : cols[1];
            const stock=parseInt(stockCol);
            if(!isNaN(stock)){ w.stock=stock; updated++; }
            if(cols.length>=4){ const price=parseFloat(String(cols[3]).replace(',','.')); if(!isNaN(price)){ w.price=price; w.budget=budgetForPrice(price); priced++; } }
            next[i]=w;
          });
          try{ persistOverrides(next); }catch(e){}
          return next;
        });
        setTimeout(()=>{ updated>0 ? notify(updated+' stock'+(updated>1?'s':'')+' mis à jour'+(priced?' · '+priced+' prix actualisés':'')) : notify('Aucune ligne reconnue — vérifiez les colonnes (id;nom;stock;prix)','error'); }, 60);
      } catch(err) { notify('Fichier illisible — enregistrez-le en CSV depuis Excel','error'); }
    };
    reader.readAsText(file, 'utf-8');

                const cnt=localWines.filter(fn).length;
                const pct=Math.round(cnt/localWines.length*100);
                return <div key={label} style={{marginBottom:9}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:3}}><span style={{color:C.text}}>{label}</span><span style={{color:C.wine,fontWeight:600}}>{cnt} ({pct}%)</span></div>
                  <div style={{background:'rgba(107,31,42,.08)',borderRadius:50,height:7,overflow:'hidden'}}><div style={{height:'100%',borderRadius:50,background:'linear-gradient(90deg,'+C.wine+','+C.wine2+')',width:pct+'%',transition:'width .5s'}}/></div>
                </div>;
              })}
            </div>
            <div style={{background:C.cream,border:'1px solid '+C.bord,borderRadius:11,padding:'14px'}}>
              <div style={{...serif,fontSize:14,color:C.wine,marginBottom:11}}>Couverture par accord</div>
              {PAIRINGS.map(p=>{
                const cnt=localWines.filter(w=>(w.pairings||[]).includes(p.id)).length;
                const pct=Math.round(cnt/localWines.length*100);
                return <div key={p.id} style={{display:'flex',alignItems:'center',gap:7,marginBottom:7}}>
                  <span style={{width:20,display:'flex',justifyContent:'center'}}><PairingIcon id={p.id} size={15}/></span>
                  <span style={{fontSize:11,color:C.text,width:100}}>{p.label}</span>

                  <span style={{fontSize:11,color:C.wine,fontWeight:600,width:28,textAlign:'right'}}>{cnt}</span>

          </div>

        {tab==='reviews'&&(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <div style={{...serif,fontSize:19,color:C.wine}}>Avis clients</div>
              {ratedWines.length>0&&<button onClick={exportReviewsCSV} style={{background:C.wine,color:'#fdf8f0',border:'none',borderRadius:50,padding:'7px 16px',fontSize:12,cursor:'pointer',fontFamily:'Montserrat,sans-serif'}}>⬇️ Export CSV</button>}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:9,marginBottom:16}}>
              {[['Clients inscrits',nbClients,'👥'],['Avis déposés',totalReviews,'💬'],['Note moyenne',totalReviews?globalAvg.toFixed(1)+'/5':'—','⭐'],['Vins notés',ratedWines.length,'🍷']].map(([l,v,i])=>(
                <div key={l} style={{background:C.cream,border:'1px solid '+C.bord,borderRadius:11,padding:'12px 8px',textAlign:'center'}}>
                  <div style={{fontSize:20}}>{i}</div>
                  <div style={{...serif,fontSize:18,fontWeight:700,color:C.wine}}>{v}</div>
                  <div style={{fontSize:10,color:C.muted,marginTop:2}}>{l}</div>
                </div>
              ))}
            </div>
            {ratedWines.length===0?(
              <div style={{background:C.cream,border:'1px solid '+C.bord,borderRadius:11,padding:'34px 18px',textAlign:'center'}}>
                <div style={{fontSize:40,marginBottom:9}}>💬</div>
                <div style={{...serif,fontSize:16,color:C.wine,marginBottom:6}}>Aucun avis pour le moment</div>
                <p style={{fontSize:12,color:C.muted,lineHeight:1.6}}>Les notes laissées par les clients connectés (carte pass) sur les vins de leur collection apparaîtront ici, pour vous aider à ajuster le stock selon ce qui plaît vraiment.</p>
              </div>
            ):(
              <div style={{background:C.cream,border:'1px solid '+C.bord,borderRadius:11,overflow:'hidden'}}>
                {ratedWines.map((r,idx)=>(
                  <div key={r.wine.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:idx<ratedWines.length-1?'1px solid '+C.bord:'none'}}>
                    <span style={{flexShrink:0}}><TypeIcon id={r.wine.type} color={(TYPES.find(t=>t.id===r.wine.type)||{}).color} size={17}/></span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{...serif,fontSize:13,fontWeight:700,color:C.wine,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.wine.name}</div>
                      <div style={{fontSize:10,color:C.muted}}>{r.wine.region} · {r.wine.price}€ · stock {r.wine.stock}</div>
                    </div>
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{fontSize:12,color:C.gold2,letterSpacing:1}}>{'★'.repeat(Math.round(r.avg))}{'☆'.repeat(5-Math.round(r.avg))}</div>
                      <div style={{fontSize:10,color:C.muted}}>{r.avg.toFixed(1)}/5 · {r.count} avis</div>
                    </div>
                    {r.avg>=4&&<span style={{flexShrink:0,fontSize:9,fontWeight:700,background:'#d4edda',color:'#155724',borderRadius:50,padding:'3px 9px'}}>TOP</span>}
                    {r.avg<=2.5&&<span style={{flexShrink:0,fontSize:9,fontWeight:700,background:'#f8d7da',color:'#721c24',borderRadius:50,padding:'3px 9px'}}>À REVOIR</span>}
                  </div>
                ))}
              </div>
            )}
            {ratedWines.some(r=>r.avg<=2.5)&&(
              <div style={{background:'#fff8f0',border:'1px solid #f5d9c6',borderRadius:8,padding:'9px 13px',fontSize:12,color:'#8a4b1f',marginTop:11}}>💡 Les vins « À revoir » sont peu appréciés par vos clients : pensez à réduire leur réassort ou à les remplacer.</div>
            )}
          </div>
        )}

        {tab==='config'&&(
          <div style={{display:'flex',flexDirection:'column',gap:11}}>
            <div style={{...serif,fontSize:19,color:C.wine,marginBottom:4}}>Configuration</div>
            <div style={{background:C.cream,border:'1px solid '+C.bord,borderRadius:11,padding:'14px'}}>
              <div style={{...serif,fontSize:14,color:C.wine,marginBottom:6}}>📥 Import du stock magasin (Excel / CSV)</div>
              <p style={{fontSize:12,color:C.muted,marginBottom:11,lineHeight:1.6}}>Mettez à jour le stock de ce magasin en une fois : depuis Excel, enregistrez votre fichier au format CSV avec les colonnes <strong>id;nom;stock;prix</strong> (ou simplement <strong>id;stock</strong>), puis importez-le ici. Les lignes inconnues sont ignorées.</p>
              <input type="file" accept=".csv,.txt" onChange={e=>{handleCSVImport(e.target.files[0]); e.target.value='';}} style={{fontSize:12,fontFamily:'Montserrat,sans-serif',color:C.text}}/>
              <div style={{background:'#f0f4ff',border:'1px solid #d0d8ff',borderRadius:8,padding:'9px 13px',fontSize:12,color:'#4040a0',marginTop:11}}>💡 Les stocks importés sont conservés sur la borne, même après redémarrage.</div>
            </div>
            <div style={{background:C.cream,border:'1px solid '+C.bord,borderRadius:11,padding:'14px'}}>
              <div style={{...serif,fontSize:14,color:C.wine,marginBottom:6}}>🛟 Sauvegarde serveur</div>
              <p style={{fontSize:12,color:C.muted,marginBottom:11,lineHeight:1.6}}>Les profils clients, notes et stocks sont automatiquement copiés sur le serveur à chaque modification. Si la borne a été réinstallée ou le cache du navigateur vidé, restaurez la dernière copie sauvegardée ici.</p>
              <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
                <button onClick={async()=>{
                  const r = await restoreFromServer();
                  if(r.profiles||r.ratings||r.stock){ notify('Données restaurées depuis le serveur — rechargement...'); setTimeout(()=>window.location.reload(), 1200); }
                  else { notify('Aucune sauvegarde serveur trouvée','error'); }
                }} style={{background:C.wine,color:'#fdf8f0',border:'none',borderRadius:50,padding:'8px 16px',fontSize:12,cursor:'pointer',fontFamily:'Montserrat,sans-serif'}}>♻️ Restaurer depuis le serveur</button>
                <button onClick={exportDataJSON} style={{background:'transparent',color:C.wine,border:'1px solid '+C.bord2,borderRadius:50,padding:'8px 16px',fontSize:12,cursor:'pointer',fontFamily:'Montserrat,sans-serif'}}>⬇️ Exporter mes données (JSON)</button>
              </div>
            </div>
            {[{title:'🏪 Magasin',fields:[['Nom','Carrefour Paris Bastille'],['Adresse','12 Rue de la Roquette, 75011'],['Responsable','Jean Dupont'],['Email','paris@wineselect.fr']]},{title:'🏆 Programme fidélité',fields:[['Seuil bronze','5 cartes'],['Réduction bronze','5%'],['Seuil argent','10 cartes'],['Réduction argent','10%'],['Seuil or','20 cartes'],['Réduction or','15%']]}].map(({title,fields})=>(
              <div key={title} style={{background:C.cream,border:'1px solid '+C.bord,borderRadius:11,padding:'14px'}}>
                <div style={{...serif,fontSize:14,color:C.wine,marginBottom:11}}>{title}</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9,marginBottom:10}}>
                  {fields.map(([l,v])=>(
                    <div key={l}><div style={{fontSize:10,color:C.muted,marginBottom:3}}>{l}</div>
                    <input defaultValue={v} style={{width:'100%',background:C.bg,border:'1px solid '+C.bord,color:C.text,borderRadius:7,padding:'7px 10px',fontSize:12,outline:'none',fontFamily:'Montserrat,sans-serif'}}/></div>
                  ))}
                </div>
                <button onClick={()=>notify('Sauvegardé')} style={{background:C.wine,color:'#fdf8f0',border:'none',borderRadius:50,padding:'7px 18px',fontSize:12,cursor:'pointer',fontFamily:'Montserrat,sans-serif'}}>Sauvegarder</button>
              </div>
            ))}
            <div style={{background:C.cream,border:'1px solid '+C.bord,borderRadius:11,padding:'14px'}}>
              <div style={{...serif,fontSize:14,color:C.wine,marginBottom:6}}>🔗 Intégration logiciel de caisse</div>
              <p style={{fontSize:12,color:C.muted,marginBottom:11,lineHeight:1.6}}>Connectez Wine Select à votre logiciel de caisse pour valider automatiquement les achats.</p>
              <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:11}}>
                {['Lightspeed','Tiller','Zelty','Storeline','Autre'].map(s=>(
                  <button key={s} onClick={()=>notify('Contactez-nous pour configurer '+s)} style={{background:C.bg,border:'1px solid '+C.bord,color:C.wine,borderRadius:50,padding:'5px 13px',fontSize:11,cursor:'pointer',fontFamily:'Montserrat,sans-serif'}}>{s}</button>
                ))}
              </div>
              <div style={{background:'#f0f4ff',border:'1px solid #d0d8ff',borderRadius:8,padding:'9px 13px',fontSize:12,color:'#4040a0'}}>💡 L'intégration caisse permet la validation automatique des achats pour le programme collectors.</div>
            </div>
            <div style={{background:C.cream,border:'1px solid '+C.bord,borderRadius:11,padding:'14px'}}>
              <div style={{...serif,fontSize:14,color:C.wine,marginBottom:6}}>🤖 Gabriel — IA</div>
              <div style={{marginBottom:9}}><div style={{fontSize:11,color:C.muted,marginBottom:4}}>Prestataire IA</div>
                <select defaultValue="mistral" style={{width:'100%',background:C.bg,border:'1px solid '+C.bord,color:C.text,borderRadius:7,padding:'7px 10px',fontSize:13,outline:'none',fontFamily:'Montserrat,sans-serif'}}>
                  <option value="mistral">Mistral AI</option><option value="openai">OpenAI GPT-4o</option><option value="anthropic">Anthropic Claude</option>
                </select>
              </div>
              <button onClick={()=>notify('Configuration sauvegardée')} style={{background:C.wine,color:'#fdf8f0',border:'none',borderRadius:50,padding:'7px 18px',fontSize:12,cursor:'pointer',fontFamily:'Montserrat,sans-serif'}}>Sauvegarder</button>
            </div>
          </div>
        )}
      </div>

      {editWine&&(
        <div style={{position:'fixed',inset:0,background:'rgba(58,16,8,.6)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:300,padding:16}} onClick={()=>setEditWine(null)}>
          <div style={{background:C.cream,borderRadius:15,border:'1px solid '+C.bord,padding:22,maxWidth:340,width:'100%'}} onClick={e=>e.stopPropagation()}>
            <div style={{...serif,fontSize:17,color:C.wine,marginBottom:3}}>{editWine.name}</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:14}}>{editWine.region} · {editWine.price}€</div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:12,color:C.muted,marginBottom:6}}>Stock actuel : <strong style={{color:C.wine}}>{editWine.stock}</strong> bouteilles</div>
              <input type="number" id="newStock" defaultValue={editWine.stock} min="0" style={{width:'100%',background:C.bg,border:'1px solid '+C.bord,color:C.text,borderRadius:8,padding:'9px 12px',fontSize:16,outline:'none',fontFamily:'Montserrat,sans-serif'}}/>
            </div>
            <div style={{display:'flex',gap:9}}>
              <button onClick={()=>{const v=parseInt(document.getElementById('newStock').value)||0;setLocalWines(p=>{const next=p.map(x=>x.id===editWine.id?{...x,stock:v}:x);persistOverrides(next);return next;});setEditWine(null);notify('Stock mis à jour : '+v+' bouteilles');}} style={{flex:1,background:C.wine,color:'#fdf8f0',border:'none',borderRadius:50,padding:10,cursor:'pointer',fontFamily:'Montserrat,sans-serif',fontSize:13,fontWeight:600}}>Valider</button>
              <button onClick={()=>setEditWine(null)} style={{flex:1,background:'transparent',color:C.wine,border:'1px solid '+C.bord,borderRadius:50,padding:10,cursor:'pointer',fontFamily:'Montserrat,sans-serif',fontSize:13}}>Annuler</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [view,    setView]    = useState('home');
  const [results, setResults] = useState([]);
  const customerApi = useCustomer();
  const collector = useCollector(customerApi);

  // ── Réinitialisation automatique entre deux clients ──────────────────────
  // Après un temps d'inactivité (aucun clic/toucher/touche), on déconnecte
  // le client en cours et on revient à l'accueil, pour ne jamais laisser le
  // profil d'un client visible pour le suivant.
  const IDLE_TIMEOUT_MS = 90 * 1000; // 90 secondes — ajustable ici
  const idleTimerRef = useRef(null);

  const resetForNextCustomer = useCallback(() => {
    customerApi.logout();
    setResults([]);
    setView('home');
    // Chaque nouveau client doit reconfirmer sa majorité — on ne réutilise
    // jamais la confirmation d'âge d'un client précédent.
    try{ sessionStorage.removeItem('ws_age_ok'); }catch(e){}
    setAgeOk(false);
  }, [customerApi]);

  useEffect(() => {
    const scheduleReset = () => {
      if (idleTimerRef.current) clearTimeout(idleTimerRef.current);
      idleTimerRef.current = setTimeout(resetForNextCustomer, IDLE_TIMEOUT_MS);
    };
    const events = ['touchstart', 'mousedown', 'keydown'];
    events.forEach(ev => window.addEventListener(ev, scheduleReset));
    scheduleReset();
    return () => {
      events.forEach(ev => window.removeEventListener(ev, scheduleReset));
      if (idleTimerRef.current) clearTimeout(idleTimerRef.current);
    };
  }, [resetForNextCustomer]);

  // Vérification de majorité — redémandée à chaque nouvelle session de la borne
  const [ageOk, setAgeOk] = useState(()=>{ try{ return sessionStorage.getItem('ws_age_ok')==='1'; }catch(e){ return false; } });
  if (!ageOk) {
    return (
      <div style={{maxWidth:680, margin:'0 auto', fontFamily:'Montserrat,sans-serif'}}>
        <AgeGate onConfirm={()=>{ try{ sessionStorage.setItem('ws_age_ok','1'); }catch(e){} setAgeOk(true); }}/>
        <SanteBanner/>
      </div>
    );
  }
  return (
    <div style={{maxWidth:680, margin:'0 auto', fontFamily:'Montserrat,sans-serif'}}>
      <style>{'@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}*{box-sizing:border-box}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(212,175,55,.35);border-radius:2px}'}</style>
      {view==='home'      && <Home          setView={setView} collector={collector} customerApi={customerApi}/>}
      {view==='login'     && <LoginScreen   setView={setView} customerApi={customerApi}/>}
      {view==='selection' && <Selection     setView={setView} setResults={setResults}/>}
      {view==='results'   && <Results       setView={setView} results={results} collector={collector}/>}
      {view==='mystery'   && <Mystery       setView={setView} collector={collector}/>}
      {view==='chat'      && <Chat          setView={setView} collector={collector} customer={customerApi.customer}/>}
      {view==='collector' && <CollectorPage setView={setView} collector={collector} customer={customerApi.customer}/>}
      {view==='admin'     && <AdminGate setView={setView}><Admin setView={setView}/></AdminGate>}
      {view!=='home' && view!=='admin' && (
        <button
          onClick={()=>{ customerApi.logout(); setResults([]); setView('home'); try{ sessionStorage.removeItem('ws_age_ok'); }catch(e){} setAgeOk(false); }}
          style={{position:'fixed', bottom:20, right:20, zIndex:50, background:C.wine, color:'#fff', border:'none', borderRadius:50, padding:'12px 22px', fontSize:13, fontWeight:600, cursor:'pointer', boxShadow:'0 4px 14px rgba(94,22,34,.3)', fontFamily:'Montserrat,sans-serif'}}
        >✓ J'ai terminé</button>
      )}
      <div style={{height:34}}/>
      <SanteBanner/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body></html>
